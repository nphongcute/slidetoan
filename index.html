        p.append(h('div', { class: 'ed-hint' }, 'Mọi giá trị đại diện, tổng, số trung bình/trung vị được tính lại tự động từ bảng này.'));
      } else if (def.editor === 'quiz') {
        this.quizEditor(p, el, set);
      }
      const ta = h('textarea', { rows: 8, class: 'mono' }, JSON.stringify(d, null, 1));
      p.append(h('details', { class: 'ed-adv' }, h('summary', {}, 'Nâng cao: dữ liệu JSON'), ta,
        bt('Áp dụng JSON', () => { try { const v = JSON.parse(ta.value); set(() => (el.data = v)); } catch (e) { U.toast('JSON không hợp lệ: ' + U.esc(e.message)); } }, 'pri')));
    },

    quizEditor(p, el, set) {
      const qs = U.clone(el.data.questions || []);
      const box = h('div', { class: 'qedit' });
      const draw = () => {
        box.innerHTML = '';
        qs.forEach((q, i) => {
          const card = h('div', { class: 'qe' }, h('div', { class: 'qe-h' }, h('b', {}, 'Câu ' + (i + 1)), h('button', { class: 'ed-x', onclick: () => { qs.splice(i, 1); draw(); } }, '×')));
          card.append(h('textarea', { rows: 2, oninput: (e) => (q.q = e.target.value) }, q.q || ''));
          (q.options = q.options || ['', '', '', '']).forEach((o, k) => card.append(h('div', { class: 'qe-o' },
            h('input', { type: 'radio', name: 'qa' + i, checked: +q.answer === k ? true : null, onchange: () => (q.answer = k), title: 'Đáp án đúng' }),
            h('input', { type: 'text', value: o, oninput: (e) => (q.options[k] = e.target.value) }))));
          card.append(h('input', { type: 'text', placeholder: 'Giải thích', value: q.explain || '', oninput: (e) => (q.explain = e.target.value) }));
          box.append(card);
        });
      };
      draw();
      p.append(box, h('div', { class: 'btnrow' },
        bt('+ Câu hỏi', () => { qs.push({ q: 'Câu hỏi mới?', options: ['A', 'B', 'C', 'D'], answer: 0, explain: '' }); draw(); }),
        bt('Áp dụng quiz', () => set(() => (el.data.questions = qs)), 'pri')));
    },
  };

  /* ---------------- helpers giao diện ---------------- */
  function keep(b) { b.addEventListener('mousedown', (e) => e.preventDefault()); return b; } // giữ vùng chọn chữ khi bấm nút định dạng
  function sec(t) { return h('h5', { class: 'ed-sec' }, t); }
  function field(label, input) { return h('label', { class: 'ed-f' }, h('span', {}, label), input); }
  function bt(label, fn, cls) { return h('button', { class: 'ed-b sm ' + (cls || ''), onclick: fn }, label); }
  function sel(opts, val, fn) { return h('select', { onchange: (e) => fn(e.target.value) }, opts.map(([v, l]) => h('option', { value: v, selected: v === val ? true : null }, l))); }

  App.editor = E;
})();

</script>

<script data-app-module="main">
/* ==========================================================================
   main.js — Khởi động: dựng khung DOM, nạp dữ liệu (ưu tiên dữ liệu nhúng trong
   file đã xuất), khởi tạo chất lượng → nền WebGL → hạt → renderer → presenter.
   Mọi hiệu ứng nặng được bọc try/catch: lỗi hiệu ứng không làm hỏng slide.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h;

  function loadDeck() {
    const tag = document.getElementById('deck-data');
    if (tag && tag.textContent.trim()) {
      try { return JSON.parse(tag.textContent); } catch (e) { console.error('[main] deck-data lỗi, dùng nội dung mặc định', e); }
    }
    return App.defaultDeck;
  }

  function boot() {
    const t0 = performance.now();
    const app = document.getElementById('app') || document.body.appendChild(h('div', { id: 'app' }));
    const gl = h('canvas', { id: 'bg-gl', 'aria-hidden': 'true' });
    const fb = h('div', { id: 'bg-fallback', 'data-section': 'A' });
    const fx = h('canvas', { id: 'fx', 'aria-hidden': 'true' });
    const stage = h('div', { id: 'stage' });
    app.append(gl, fb, fx, h('div', { id: 'viewport' }, stage));

    App.store.load(loadDeck());
    App.quality.init();
    try { App.bg.init(gl, fb); } catch (e) { console.error('[main] nền WebGL lỗi', e); fb.style.display = 'block'; gl.style.display = 'none'; }
    try { App.particles.init(fx); } catch (e) { console.error('[main] particles lỗi', e); }
    App.renderer.init(stage);
    App.renderer.renderAll();
    App.presenter.init();
    App.settings.init();
    App.io.init();
    App.quality.apply(); // phát cấu hình cho mọi module đã đăng ký

    const n = parseInt((location.hash.match(/\d+/) || [])[0], 10);
    App.presenter.go(n ? n - 1 : 0, { step: 0 });
    App.history.reset(App.store.json());
    App.presenter.wakeHud();
    App.bootMs = Math.round(performance.now() - t0);
    console.info('[main] khởi động xong sau', App.bootMs, 'ms · WebGL:', App.quality.stats.webgl, '· mức:', App.quality.tier);
    setTimeout(() => App.io.checkRestore(), 600);
    window.addEventListener('beforeunload', () => { if (App.editor && App.editor.active) App.io.save(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
