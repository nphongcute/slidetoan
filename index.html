/* ==========================================================================
   base.css — Design tokens, lớp nền, typography, ký hiệu toán, bảng, thẻ.
   2 font: Lora (display, công thức) + Inter (nội dung, giao diện).
   ========================================================================== */
:root {
  --bg: #05060f;
  --ink: #f3f5ff;
  --ink2: #dfe4f7;
  --muted: #aab3d1;
  --dim: #6f7899;
  --panel: rgba(11, 15, 30, 0.82);
  --panel-solid: #0b0f1e;
  --line: rgba(255, 255, 255, 0.12);
  --acc: #ffb547;
  --acc2: #8c7cff;
  --ff-d: 'Lora', Georgia, 'Times New Roman', serif;
  --ff: 'Inter', system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
  --ease-out: cubic-bezier(0.16, 0.84, 0.24, 1);
  --ease-io: cubic-bezier(0.77, 0, 0.18, 1);
}
[data-section='A'] { --acc: #ffb547; --acc2: #8c7cff; }
[data-section='B'] { --acc: #4fd1e8; --acc2: #9bf27a; }
[data-section='C'] { --acc: #ff8a5c; --acc2: #ffc857; }
[data-section='D'] { --acc: #ffd36b; --acc2: #7cc8ff; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--ff); -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; }
#bg-gl, #bg-fallback, #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
#bg-gl { display: block; }
#fx { pointer-events: none; transition: opacity 0.6s; }
#bg-fallback { display: none; transition: background 0.8s; }
#bg-fallback, .slide.is-static { background: radial-gradient(80% 90% at 20% 15%, #1a1d5c 0%, transparent 60%), radial-gradient(70% 80% at 85% 85%, #3a1a66 0%, transparent 60%), #04050d; }
#bg-fallback[data-section='B'], .slide.is-static[data-section='B'] { background: radial-gradient(80% 90% at 20% 15%, #0a3540 0%, transparent 60%), radial-gradient(70% 80% at 85% 85%, #0f4a52 0%, transparent 60%), #030c10; }
#bg-fallback[data-section='C'], .slide.is-static[data-section='C'] { background: radial-gradient(80% 90% at 20% 15%, #3a1036 0%, transparent 60%), radial-gradient(70% 80% at 85% 85%, #4f1a33 0%, transparent 60%), #0d050f; }
#bg-fallback[data-section='D'], .slide.is-static[data-section='D'] { background: radial-gradient(80% 90% at 20% 15%, #272051 0%, transparent 60%), radial-gradient(70% 80% at 85% 85%, #3e3010 0%, transparent 60%), #06060e; }
#viewport { position: absolute; inset: 0; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
html.idle, html.idle * { cursor: none !important; }

/* ---------------- Typography ---------------- */
.content { width: 100%; height: 100%; }
.kicker { font: 600 24px/1.2 var(--ff); letter-spacing: 0.2em; text-transform: uppercase; color: var(--acc); display: flex; align-items: center; gap: 18px; }
.kicker::before { content: ''; width: 46px; height: 2px; background: var(--acc); flex: none; }
.t-hero { font-family: var(--ff-d); font-weight: 600; font-size: 98px; line-height: 1.05; letter-spacing: -0.02em; }
.t-chapter { font: 800 54px/1 'Inter Display', var(--ff); letter-spacing: 0.04em; text-transform: uppercase; background: linear-gradient(90deg, var(--acc), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.t-title { font-family: var(--ff-d); font-weight: 600; font-size: 60px; line-height: 1.14; letter-spacing: -0.01em; }
.t-hero em, .t-title em { font-style: italic; font-weight: 500; color: var(--acc); }
.t-body { font-size: 34px; line-height: 1.45; color: var(--ink); }
.t-support { font-size: 30px; line-height: 1.45; color: var(--ink2); }
.t-cap2 { font-size: 28px; line-height: 1.45; color: var(--ink2); }
.t-cap { font-size: 24px; line-height: 1.35; color: var(--muted); }
.t-lbl { font: 600 28px/1.3 var(--ff); color: var(--ink); }
.t-closing { font-family: var(--ff-d); font-style: italic; font-weight: 500; font-size: 64px; line-height: 1.2; }
.center { text-align: center; }
.acc { color: var(--acc); }
.muted { color: var(--muted); }
b, strong { font-weight: 700; }
em { font-style: italic; }
kbd { font: 600 0.85em var(--ff); padding: 2px 12px; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 8px; background: rgba(255, 255, 255, 0.06); color: var(--ink); }

/* Glow theo con trỏ (chỉ tiêu đề / từ khoá) — cập nhật --gx/--gy từ presenter */
.glow { --gx: -9999px; --gy: -9999px; background: radial-gradient(420px circle at var(--gx) var(--gy), #ffffff 0%, var(--acc) 28%, var(--ink) 64%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.glow em { color: var(--acc); }
html[data-tier='performance'] .glow, html.editing .glow, .is-static .glow { background: none; color: var(--ink); }

/* ---------------- Ký hiệu toán ---------------- */
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 0.12em; line-height: 1.15; }
.frac > span { padding: 0 0.18em; white-space: nowrap; }
.frac > span:first-child { border-bottom: 0.05em solid currentColor; padding-bottom: 0.08em; }
.frac > span:last-child { padding-top: 0.08em; }
.frac .frac { font-size: 0.92em; }
.bar { position: relative; display: inline-block; font-style: italic; font-family: var(--ff-d); line-height: 1; }
.bar::after { content: ''; position: absolute; left: 0.16em; right: -0.04em; top: 0.08em; border-top: 0.065em solid currentColor; }
.glow .bar::after { border-top-color: var(--acc); }
sub { font-size: 0.62em; vertical-align: -0.28em; line-height: 0; }
.formula { font-family: var(--ff-d); display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink); white-space: nowrap; }
.formula > .fx { max-width: 100%; }
.hero-f { font-size: 96px; }
.med-f { font-size: 62px; }
.small-f { font-size: 32px; justify-content: flex-start; white-space: normal; text-align: left; line-height: 1.5; }
.small-f .fx { text-align: left; }
.stepnum { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--acc); color: #120a06; font: 800 32px var(--ff); margin-right: 28px; flex: none; }

/* ---------------- Thẻ / khối ---------------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 32px 40px; }
.card.def { border-left: 6px solid var(--acc); background: linear-gradient(120deg, rgba(255, 255, 255, 0.06), rgba(11, 15, 30, 0.85) 55%); }
.card.soft { background: rgba(255, 255, 255, 0.045); }
.card.slim { padding: 22px 36px; }
.card.q { border-color: var(--acc); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04); padding-top: 38px; }
.card.panel { background: rgba(11, 15, 30, 0.7); }
.card.feature { display: flex; flex-direction: column; justify-content: center; }
.card.feature h3, .card.stop h3 { font: 600 42px/1.15 var(--ff-d); margin: 6px 0 12px; color: var(--ink); }
.card.feature p, .card.stop p { font-size: 28px; line-height: 1.45; color: var(--ink2); margin: 0; }
.big-sym { font-family: var(--ff-d); font-size: 80px; line-height: 1; color: var(--acc); }
.stop-n, .lbl { font: 600 22px/1.2 var(--ff); letter-spacing: 0.16em; text-transform: uppercase; color: var(--acc); margin-bottom: 14px; }
.card.stop { border-top: 4px solid var(--acc); }
.card.sum ul.ticks { font-size: 28px; }
.sumf { font-family: var(--ff-d); font-size: 46px; margin: 22px 0 18px; color: var(--ink); white-space: nowrap; }
.sumf.sm { font-size: 25px; }
.card.sum p { font-size: 27px; }
.stepline { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 26px; }
.stepline:last-child { margin-bottom: 0; }
.stepline > span { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--acc); color: #10131f; font: 800 26px var(--ff); }
ul.ticks { margin: 0; padding: 0; list-style: none; }
ul.ticks li { position: relative; padding-left: 38px; margin: 0 0 16px; }
ul.ticks li:last-child { margin-bottom: 0; }
ul.ticks li::before { content: ''; position: absolute; left: 4px; top: 0.5em; width: 13px; height: 13px; border-radius: 3px; background: var(--acc); transform: rotate(45deg); }
.qn { display: inline-grid; place-items: center; width: 50px; height: 50px; margin-right: 16px; border-radius: 14px; border: 2px solid var(--acc); color: var(--acc); font: 700 26px var(--ff); vertical-align: 4px; }
.keys .keyrow { display: flex; gap: 28px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 30px; color: var(--ink2); }
.keys .keyrow:last-child { border-bottom: 0; }
.keys .keyrow b { font-family: var(--ff-d); font-size: 44px; color: var(--acc); min-width: 80px; font-weight: 600; }
.numgrid { font-variant-numeric: tabular-nums; word-spacing: 0.4em; line-height: 1.75; font-size: 27px; color: var(--ink); }
.pill { display: inline-block; padding: 4px 16px; border-radius: 999px; background: var(--acc); color: #120a06; font: 700 22px var(--ff); margin-right: 12px; vertical-align: 3px; }

/* ---------------- Bảng số liệu ---------------- */
.dtable { width: 100%; height: 100%; border-collapse: separate; border-spacing: 0; font-size: 30px; font-variant-numeric: tabular-nums; background: rgba(9, 12, 26, 0.78); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.dtable.compact, .compact .dtable { font-size: 27px; }
.tight .dtable { font-size: 24px; }
.tight .dtable th, .tight .dtable td { padding: 8px 10px; }
.dtable th, .dtable td { padding: 10px 14px; text-align: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap; }
.dtable tr > *:last-child { border-right: 0; }
.dtable tr:last-child > * { border-bottom: 0; }
.dtable th { background: rgba(255, 255, 255, 0.07); color: var(--ink); font-weight: 600; }
.dtable tr > th:first-child { text-align: left; }
.dtable .hlc { color: var(--acc); font-weight: 700; }
.dtable .total td { border-top: 2px solid var(--acc); font-weight: 700; }
.el-image .content img { width: 100%; height: 100%; display: block; }
.shape { background: var(--acc); border-radius: 18px; opacity: 0.9; }
.shape-circle { border-radius: 50%; }
.shape-line { height: 4px !important; border-radius: 4px; margin-top: auto; }

/* ==========================================================================
   slides.css — Slide, reveal từng bước, chuyển cảnh điện ảnh.
   Chỉ animate transform / opacity / clip-path (+ blur ở mức High).
   ========================================================================== */
.slide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; contain: layout paint style; }
.slide.is-active, .slide.is-leaving { display: block; }
.slide.is-active { z-index: 2; }
.slide.is-leaving { z-index: 1; pointer-events: none; animation: s-leave 0.65s var(--ease-out) both; }
.slide.is-leaving.back { animation-name: s-leave-back; }
.slide-veil { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, rgba(3, 4, 10, 0.2), rgba(3, 4, 10, 0.85)); pointer-events: none; }
.slide-bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.35; }

/* Lifecycle: animation CSS của slide không hiển thị bị tạm dừng */
.slide:not(.is-active) * { animation-play-state: paused !important; }

/* ---------------- Phần tử ---------------- */
.el { position: absolute; }
.el.hid { visibility: hidden; opacity: 0; }
.el.has-depth { translate: calc(var(--px, 0) * var(--d) * -38px) calc(var(--py, 0) * var(--d) * -26px); }
.el.rv { animation: rv-up 0.9s var(--ease-out) both; }
.el.rv[data-anim='mask'] { animation-name: rv-mask; animation-duration: 1.05s; animation-timing-function: var(--ease-io); }
.el.rv[data-anim='left'] { animation-name: rv-left; }
.el.rv[data-anim='right'] { animation-name: rv-right; }
.el.rv[data-anim='scale'] { animation-name: rv-scale; }
.el.rv[data-anim='fade'] { animation-name: rv-fade; animation-duration: 1.1s; }
.el.rv[data-anim='none'] { animation: none; }
@keyframes rv-up { from { opacity: 0; transform: translateY(42px); } to { opacity: 1; transform: none; } }
@keyframes rv-left { from { opacity: 0; transform: translateX(-46px); } to { opacity: 1; transform: none; } }
@keyframes rv-right { from { opacity: 0; transform: translateX(46px); } to { opacity: 1; transform: none; } }
@keyframes rv-scale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: none; } }
@keyframes rv-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rv-mask { from { clip-path: inset(0 100% 0 0); transform: translateX(-20px); } to { clip-path: inset(0 0 0 0); transform: none; } }
html[data-trans='lite'] .el.rv { animation-name: rv-fade !important; animation-duration: 0.45s !important; }

/* ---------------- Chuyển cảnh slide ---------------- */
.slide.is-entering.t-mask { animation: t-mask 1s var(--ease-io) both; }
.slide.is-entering.t-circle { animation: t-circle 1.15s var(--ease-io) both; }
.slide.is-entering.t-wipe { animation: t-wipe 1s var(--ease-io) both; }
.slide.is-entering.t-depth { animation: t-depth 1.05s var(--ease-out) both; }
.slide.is-entering.t-fade { animation: rv-fade 0.8s ease both; }
.slide.is-entering.t-back { animation: t-back 0.75s var(--ease-out) both; }
@keyframes t-mask { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes t-circle { from { clip-path: circle(0% at 50% 55%); } to { clip-path: circle(75% at 50% 55%); } }
@keyframes t-wipe { from { clip-path: polygon(0 0, 0 0, -25% 100%, 0 100%); } to { clip-path: polygon(0 0, 125% 0, 100% 100%, 0 100%); } }
@keyframes t-depth { from { opacity: 0; transform: scale(1.06); filter: blur(14px); } to { opacity: 1; transform: none; filter: blur(0); } }
@keyframes t-back { from { opacity: 0; transform: translateX(-60px); } to { opacity: 1; transform: none; } }
@keyframes s-leave { to { opacity: 0; transform: scale(0.965); } }
@keyframes s-leave-back { to { opacity: 0; transform: translateX(60px); } }
html.no-blur .slide.is-entering.t-depth { animation-name: t-depth-nb; }
@keyframes t-depth-nb { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: none; } }
html[data-trans='lite'] .slide.is-entering { animation: rv-fade 0.45s ease both !important; }
html[data-trans='lite'] .slide.is-leaving { animation: s-fade-out 0.35s ease both !important; }
@keyframes s-fade-out { to { opacity: 0; } }

/* Ảnh thu nhỏ tĩnh */
.thumb-box { position: relative; overflow: hidden; border-radius: 10px; flex: none; }
.slide.is-static { display: block; position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; contain: strict; }
.slide.is-static * { animation: none !important; transition: none !important; }

/* ==========================================================================
   widgets.css — Kiểu cho các widget trực quan hoá.
   Biểu đồ tần số: 1 sắc độ (độ lớn). Nhóm: bảng màu 6 sắc đã kiểm định CVD,
   luôn kèm nhãn chữ (không truyền thông tin chỉ bằng màu).
   ========================================================================== */
.w-host { position: relative; }
.w-root { position: relative; width: 100%; height: 100%; }
.w-host > svg, .w-root > svg { width: 100%; height: 100%; display: block; overflow: visible; position: relative; }
.w-missing { padding: 20px; border: 1px dashed #ff6b81; color: #ff9aa8; font-size: 22px; border-radius: 12px; }
.ws { opacity: 0; transform: translateY(12px); transition: opacity 0.55s var(--ease-out), transform 0.65s var(--ease-out); }
.ws.on { opacity: 1; transform: none; }
.instant .ws, .instant .ws *, .instant .gl-dot, .instant .mc-beamg, .instant .mc-ful { transition: none !important; }
.w-tip { position: absolute; transform: translate(-50%, calc(-100% - 18px)); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-size: 22px; line-height: 1.35; color: var(--ink); pointer-events: none; opacity: 0; transition: opacity 0.2s; white-space: nowrap; z-index: 5; }
.w-tip.on { opacity: 1; }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes growX { from { transform: scaleX(0); } }
@keyframes draw { from { stroke-dashoffset: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { transform: scale(1.4); opacity: 0.04; } }

/* hero */
.hv-orb { position: absolute; border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, 0.22); will-change: transform; pointer-events: none; }
.hv-orb.o2 { border: 2px dashed rgba(255, 255, 255, 0.12); }
.hv-orb i { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--acc); right: -7px; top: calc(50% - 7px); }
.hv-orb.o2 i { width: 10px; height: 10px; background: var(--acc2); left: calc(50% - 5px); top: -5px; right: auto; }
html[data-tier='performance'] .hv-orb { animation: none !important; will-change: auto; }
.spin-slow { animation: spin 70s linear infinite; }
.spin-rev { animation: spin 46s linear infinite reverse; }
.hv-bar { fill: url(#hvg); transform-box: fill-box; transform-origin: bottom; }
.heroviz.play .hv-bar { animation: growY 1.3s var(--ease-out) both; animation-delay: calc(var(--i) * 80ms + 0.35s); }
.hv-curve { fill: none; stroke: var(--acc); stroke-width: 3; stroke-dasharray: 1; stroke-linejoin: round; }
.heroviz.play .hv-curve { animation: draw 2.2s ease 1s both; }
.hv-mean { stroke: var(--ink); stroke-dasharray: 6 9; stroke-width: 2; opacity: 0.7; }
.hv-lbl { font: italic 600 44px var(--ff-d); fill: var(--ink); }
.hv-bar-l { stroke: var(--ink); stroke-width: 3; }
.hv-axis { stroke: rgba(255, 255, 255, 0.35); stroke-width: 2; }

/* journey */
.j-path-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 3; }
.j-path { fill: none; stroke: url(#jg); stroke-width: 4; stroke-dasharray: 1; stroke-linecap: round; }
.journey.play .j-path { animation: draw 2.2s var(--ease-io) both; }
.j-halo { fill: var(--acc); opacity: 0.16; transform-box: fill-box; transform-origin: center; }
.journey.play .j-halo { animation: pulse 2.8s ease-in-out infinite; animation-delay: calc(var(--i) * 0.5s); }
.j-dot { fill: var(--acc); stroke: #05060f; stroke-width: 4; }
.j-num { font: 600 24px var(--ff); fill: var(--muted); letter-spacing: 0.12em; }

/* interval */
.iv-axis { stroke: rgba(255, 255, 255, 0.35); stroke-width: 2; }
.iv-arrow { fill: rgba(255, 255, 255, 0.35); }
.interval .acc { fill: var(--acc); }
.iv-seg { stroke: var(--acc); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 1; }
.interval.play .iv-seg { animation: draw 1.2s var(--ease-io) 0.3s both; }
.iv-closed { fill: var(--acc); }
.iv-open { fill: var(--panel-solid); stroke: var(--acc); stroke-width: 4; }
.iv-lbl { font: italic 600 46px var(--ff-d); fill: var(--ink); }
.iv-small { font: 500 23px var(--ff); fill: var(--muted); }
.iv-dim { stroke: var(--acc); stroke-width: 2.5; }
.iv-mid { stroke: var(--acc2); stroke-dasharray: 5 6; stroke-width: 2.5; }
.iv-midpt { fill: var(--acc2); }
.interval .iv-lbl.acc { fill: var(--acc2); }

/* counter */
.counter { height: 100%; display: flex; flex-direction: column; justify-content: center; }
.ct-num { font: 600 186px/1 var(--ff-d); letter-spacing: -0.03em; font-variant-numeric: tabular-nums lining-nums; background: linear-gradient(180deg, #ffffff 20%, var(--acc)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 8px; }
.ct-label { font-size: 32px; line-height: 1.4; color: var(--ink2); margin-top: 18px; }

/* hbars */
.hbars { display: flex; flex-direction: column; justify-content: center; gap: 36px; height: 100%; }
.hb-row { display: grid; grid-template-columns: 340px 1fr 210px; align-items: center; gap: 24px; }
.hb-lbl { font-size: 28px; color: var(--ink2); }
.hb-track { height: 58px; background: rgba(255, 255, 255, 0.05); border-radius: 6px; overflow: hidden; }
.hb-fill { height: 100%; background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 45%, transparent), var(--acc)); border-radius: 0 6px 6px 0; transform-origin: left; }
.hbars.play .hb-fill { animation: growX 1.3s var(--ease-out) both; animation-delay: calc(var(--i) * 160ms + 0.3s); }
.hb-val { font: 600 30px var(--ff); font-variant-numeric: tabular-nums; text-align: right; }
.hb-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 24px; font-size: 30px; color: var(--ink2); }
.hb-total b { font: 600 50px var(--ff-d); color: var(--acc); }

/* histogram (biểu đồ tần số) */
.hist .grid { stroke: rgba(255, 255, 255, 0.08); }
.hist .axis { stroke: rgba(255, 255, 255, 0.4); stroke-width: 2; }
.hist .tick { font: 22px var(--ff); fill: var(--muted); }
.bar-fill { fill: var(--acc); transition: opacity 0.4s; transform-box: fill-box; transform-origin: bottom; }
.hist.play .bar-fill { animation: growY 1s var(--ease-out) both; animation-delay: calc(var(--i) * 70ms + 0.25s); }
.bar.dim .bar-fill { opacity: 0.25; }
.bar.hl .bar-fill { stroke: #fff; stroke-width: 3; }
.bar:hover .bar-fill { opacity: 1; }
.bar-val { font: 600 26px var(--ff); fill: var(--ink); }
.bar.dim .bar-val { fill: var(--muted); }
.xlbl { font: 22px var(--ff); fill: var(--ink2); }
.axlbl { font: 600 22px var(--ff); fill: var(--muted); }
.hit { fill: transparent; cursor: default; }
.hist-total { font: 700 30px var(--ff); fill: var(--acc); }

/* groupline */
.gl-axis { stroke: rgba(255, 255, 255, 0.55); stroke-width: 2; }
.gl-tick { stroke: rgba(255, 255, 255, 0.55); stroke-width: 2; }
.gl-tl { font: 22px var(--ff); fill: var(--muted); paint-order: stroke; stroke: #05060f; stroke-width: 6px; }
.gl-el { font: 600 22px var(--ff); fill: var(--acc); paint-order: stroke; stroke: #05060f; stroke-width: 7px; stroke-linejoin: round; }
.gl-edge { stroke: var(--acc); stroke-dasharray: 6 7; stroke-width: 2; opacity: 0.75; }
.gl-band { opacity: 0.12; }
.gl-bin { opacity: 0.12; }
.gl-dot { fill: #e6ebff; stroke: #070912; stroke-width: 2; transition: transform 1.05s cubic-bezier(0.6, 0, 0.2, 1), fill 0.5s; }
.gl.s-edges .gl-dot { fill: var(--gc); }
.gl.s-drop .gl-dot { transform: var(--to); }
.gl-range { fill: none; stroke: var(--acc2); stroke-width: 2.5; }
.gl-rt { font: 600 26px var(--ff); fill: var(--acc2); }
.gl-count { font: 700 32px var(--ff); fill: var(--ink); }
.gl-gl { font: 600 22px var(--ff); fill: var(--ink2); }

/* meancalc */
.mc { display: grid; grid-template-columns: 52% 1fr; gap: 36px; height: 100%; }
.mc-left { display: flex; align-items: flex-start; min-width: 0; }
.mc-table { height: auto !important; font-size: 28px; }
.mc-table th { font-size: 24px; white-space: normal; line-height: 1.25; }
.mc-table td, .mc-table th { padding: 13px 12px; }
.mc-table td.g { text-align: left; color: var(--ink2); }
.mc-table .acc { color: var(--acc); }
.mc-table .acc2 { color: var(--acc2); font-size: 25px; }
.mc-right { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mc-beam { width: 100%; height: auto; overflow: visible; }
.mc-bar { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
.mc-tick { stroke: rgba(255, 255, 255, 0.6); stroke-width: 2; }
.mc-wt { fill: var(--acc2); }
.mc-wl { font: 600 22px var(--ff); fill: var(--ink); }
.mc-al { font: 20px var(--ff); fill: var(--muted); }
.mc-tri { fill: var(--acc); }
.mc-fl { font: 700 28px var(--ff); fill: var(--acc); }
.mc-beamg, .mc-ful { transition: transform 1.3s var(--ease-io); }
.mc-cap { font-size: 22px; line-height: 1.4; color: var(--muted); }
.mc-left { flex-direction: column; gap: 22px; }
.mc-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.mc-st { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; font-size: 21px; color: var(--muted); transition: all 0.4s; }
.mc-st em { font-style: normal; }
.mc-st span { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); font: 700 18px var(--ff); }
.mc-st.cur { border-color: var(--acc); color: var(--ink); background: color-mix(in srgb, var(--acc) 12%, transparent); }
.mc-st.cur span { background: var(--acc); border-color: var(--acc); color: #120a06; }
.mc-st.done { color: var(--ink2); }
.mc-st.done span { border-color: var(--acc); color: var(--acc); }
.mc-formula { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.mc-formula .fl { font-size: 27px; white-space: nowrap; overflow: hidden; max-width: 100%; color: var(--ink2); }
.mc-formula .fl.big { font-family: var(--ff-d); font-size: 34px; color: var(--ink); }
.fl.res b { color: var(--acc); font-size: 1.3em; }

/* cumlocate */
.cl-cell { opacity: 0.9; }
.cl-cl { font: 600 20px var(--ff); fill: #081018; }
.cl-br { fill: none; stroke-width: 3; }
.cl-gl { font: 600 22px var(--ff); fill: var(--ink2); }
.cl-mid { fill: none; stroke: #fff; stroke-width: 4; }
.cl-mt { font: 600 26px var(--ff); fill: #fff; }
.cl-ttl { font: 600 22px var(--ff); fill: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
.cl-axis { stroke: rgba(255, 255, 255, 0.35); stroke-width: 2; }
.cl-bar rect { fill: rgba(255, 255, 255, 0.18); }
.cl-bar.hl rect { fill: var(--acc); }
.cl-v { font: 700 26px var(--ff); fill: var(--ink); }
.cl-x { font: 22px var(--ff); fill: var(--ink2); }
.cl-half { stroke: var(--acc2); stroke-dasharray: 8 8; stroke-width: 2.5; }
.cl-ht { font: 600 24px var(--ff); fill: var(--acc2); }
.cl-note { font: 24px var(--ff); fill: var(--ink2); }
.cl-ans { font: 700 40px var(--ff-d); fill: var(--acc); }

/* mediancalc */
.md { display: flex; flex-direction: column; gap: 14px; height: 100%; }
.md-table { height: auto !important; }
.md-table td, .md-table th { padding: 10px 12px; transition: background 0.4s, color 0.4s; }
.md.show-p .md-table .pcol { background: color-mix(in srgb, var(--acc) 22%, transparent); color: var(--ink); font-weight: 700; }
.md-strip { width: 100%; height: auto; overflow: visible; }
.md-seg rect { opacity: 0.88; transition: opacity 0.5s; }
.md.show-p .md-seg:not(.p) rect { opacity: 0.22; }
.md-m { font: 700 24px var(--ff); fill: #081018; }
.md-cells line { stroke: rgba(5, 6, 15, 0.45); stroke-width: 1.5; }
.md-ctick { stroke: rgba(255, 255, 255, 0.5); stroke-width: 2; }
.md-cv { font: 22px var(--ff); fill: var(--muted); }
.md-cv.hl { fill: var(--acc); font-weight: 700; }
.md-cap { font: 20px var(--ff); fill: var(--dim); }
.md-half { stroke: #fff; stroke-width: 3; }
.md-halfa { fill: #fff; }
.md-ht { font: 600 26px var(--ff); fill: #fff; }
.md-bottom { display: grid; grid-template-columns: 1fr 42%; gap: 30px; flex: 1; min-height: 0; }
.md-formula { display: flex; flex-direction: column; gap: 18px; justify-content: center; min-width: 0; }
.md-formula .fl { font-size: 28px; line-height: 1.4; white-space: nowrap; overflow: hidden; color: var(--ink2); }
.md-formula .fl.big { font-family: var(--ff-d); font-size: 38px; color: var(--ink); }
.md-zwrap { display: flex; align-items: center; min-width: 0; }
.md-zoom { width: 100%; height: auto; overflow: visible; }
.md-zt { font: 20px var(--ff); fill: var(--muted); }
.md-zbg { fill: rgba(255, 255, 255, 0.07); stroke: var(--line); }
.md-zfill { fill: var(--acc); opacity: 0.85; }
.md-zc { stroke: rgba(5, 6, 15, 0.5); }
.md-zl { font: 700 22px var(--ff); fill: #120a06; }
.md-zaxis { stroke: rgba(255, 255, 255, 0.5); stroke-width: 2; }
.md-zm { stroke: #fff; stroke-width: 3; }
.md-zm.thin { stroke-width: 2; stroke-dasharray: 4 4; opacity: 0.7; }
.md-za { font: 22px var(--ff); fill: var(--ink2); }

.quiz .btn { font-size: 24px; padding: 12px 24px; }

/* ==========================================================================
   hud.css — Thanh điều khiển, nút, bảng Settings, Overview, Toast.
   ========================================================================== */
.btn { font: 600 15px var(--ff); color: #0b0d18; background: var(--acc); border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; transition: filter 0.2s, transform 0.2s, opacity 0.2s; }

#hud { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(8, 10, 22, 0.78); border: 1px solid var(--line); border-radius: 16px; z-index: 50; transition: opacity 0.35s, transform 0.35s; backdrop-filter: blur(8px); }

.hud-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--ink); font-size: 20px; cursor: pointer; transition: background 0.2s; }
.hud-btn:hover { background: rgba(255, 255, 255, 0.1); }

.hud-btn.edit svg { fill: none; }

.hud-prog-fill { height: 100%; background: var(--acc); transform-origin: left; transition: transform 0.5s var(--ease-out); }
.hud-count { font: 600 14px var(--ff); font-variant-numeric: tabular-nums; color: var(--ink2); min-width: 58px; text-align: center; }

#settings { position: absolute; right: 22px; bottom: 86px; width: 380px; max-height: calc(100vh - 120px); overflow: auto; background: rgba(8, 10, 22, 0.97); border: 1px solid var(--line); border-radius: 18px; padding: 20px; z-index: 60; font-size: 14px; color: var(--ink2); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity 0.25s, transform 0.25s; }

.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }

#fpsmeter { position: absolute; top: 12px; right: 12px; z-index: 70; font: 600 12px/1.4 ui-monospace, monospace; background: rgba(0, 0, 0, 0.6); color: #9bf27a; padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: pre; display: none; }
#fpsmeter.on { display: block; }

/* Overview */
#overview { position: absolute; inset: 0; z-index: 80; background: rgba(4, 5, 12, 0.94); overflow: auto; padding: 36px 48px 60px; display: none; }
#overview.open { display: block; }
.ov-head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 24px; font-size: 15px; color: var(--muted); }
.ov-head b { font: 600 28px var(--ff-d); color: var(--ink); }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
.ov-card { position: relative; padding: 0; border: 2px solid transparent; border-radius: 12px; background: none; cursor: pointer; transition: transform 0.2s, border-color 0.2s; }
.ov-card:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.3); }
.ov-card.cur { border-color: var(--acc); }
.ov-n { position: absolute; left: 8px; top: 8px; background: rgba(0, 0, 0, 0.7); color: #fff; font: 700 13px var(--ff); padding: 2px 8px; border-radius: 6px; }

/* Toast */
#toasts { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { display: flex; align-items: center; gap: 10px; background: rgba(10, 13, 26, 0.97); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 12px; font: 500 14px var(--ff); opacity: 0; transform: translateY(-8px); transition: opacity 0.3s, transform 0.3s; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
.toast.in { opacity: 1; transform: none; }

   khung chọn, tay nắm resize, đường gióng).
   ========================================================================== */
#editor-ui { display: none; }
#editor-ui.open { display: block; }

.snaplist .row { border-bottom: 1px solid var(--line); }

<script data-app-module="core">
/* ==========================================================================

    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  };

  /** Hiển thị thông báo ngắn (toast). actions: [{label, fn}] */
  U.toast = function (msg, actions, ms) {
    let host = U.$('#toasts');
    if (!host) { host = U.h('div', { id: 'toasts' }); document.body.append(host); }
    const t = U.h('div', { class: 'toast' }, U.h('span', { html: msg }));
    (actions || []).forEach((a) => t.append(U.h('button', { class: 'btn sm', onclick: () => { a.fn(); t.remove(); } }, a.label)));
    if (actions && actions.length) t.append(U.h('button', { class: 'btn sm ghost', onclick: () => t.remove() }, 'Đóng'));
    host.append(t);
    requestAnimationFrame(() => t.classList.add('in'));
    setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 400); }, ms || (actions && actions.length ? 12000 : 2600));
  };

  /** Làm sạch HTML do người dùng nhập: bỏ <script>, thuộc tính on*, javascript: */
  U.sanitize = function (html) {
    const tpl = document.createElement('template');
    tpl.innerHTML = String(html);
    tpl.content.querySelectorAll('script,iframe,object,embed,link,meta').forEach((n) => n.remove());
    tpl.content.querySelectorAll('*').forEach((n) => {
      [...n.attributes].forEach((a) => {
        if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) n.removeAttribute(a.name);
      });
    });
    return tpl.innerHTML;
  };

  /** Thu nhỏ cỡ chữ của phần tử cho tới khi vừa khung (dùng cho công thức dài) */
  U.fitText = function (node, minPx) {
    let fs = parseFloat(getComputedStyle(node).fontSize) || 30;
    let guard = 24;
    while (guard-- > 0 && fs > (minPx || 16) && (node.scrollWidth > node.clientWidth + 1 || node.scrollHeight > node.clientHeight + 1)) {
      fs -= 2;
      node.style.fontSize = fs + 'px';
    }
  };
})();

</script>
<script data-app-module="quality">
/* ==========================================================================
   quality.js — Hệ thống chất lượng thích ứng (Adaptive Quality).
   3 mức: high / balanced / performance. Chế độ "auto" đo FPS thực tế từ vòng
   rAF (không dựa vào tên GPU hay user-agent) và hạ mức khi khung hình bị rớt
   kéo dài. Người dùng có thể chọn thủ công trong Settings.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util;
  const KEY = 'ch3deck:quality';

  const TIERS = {
    high: {
      label: 'Cao', shader: 'live', octaves: 5, glScale: 0.5, glFps: 30,
      particles: 110, lines: true, pFps: 60, dpr: 1.5,
      parallax: true, glow: true, blur: true, transitions: 'full',
    },
    balanced: {
      label: 'Cân bằng', shader: 'live', octaves: 3, glScale: 0.4, glFps: 24,
      particles: 55, lines: true, pFps: 30, dpr: 1,
      parallax: true, glow: true, blur: false, transitions: 'full',
    },
    performance: {
      label: 'Hiệu năng', shader: 'static', octaves: 2, glScale: 0.25, glFps: 0,
      particles: 18, lines: false, pFps: 24, dpr: 1,
      parallax: false, glow: false, blur: false, transitions: 'lite',
    },
  };
  const ORDER = ['high', 'balanced', 'performance'];

  const Q = {
    TIERS, ORDER,
    mode: 'auto',          // auto | high | balanced | performance
    tier: 'high',
    toggles: { shader: true, particles: true, parallax: true, fpsMeter: false },
    stats: { fps: 0, frameMs: 0, drops: 0, initMs: 0, webgl: null, downgrades: [] },
    reduced: false,
    _win: { t0: 0, frames: 0, sum: 0, long: 0 },
    _bad: 0, _graceUntil: 0, _cooldownUntil: 0,

    init() {
      this.reduced = U.reducedMotion();
      try {
        const s = JSON.parse(U.store.get(KEY) || 'null');
        if (s) { this.mode = s.mode || 'auto'; Object.assign(this.toggles, s.toggles || {}); }
      } catch (e) { /* bỏ qua */ }
      let tier = this.mode === 'auto' ? 'high' : this.mode;
      if (this.mode === 'auto' && this.reduced) tier = 'performance';
      this.tier = tier;
      this._graceUntil = performance.now() + 2500; // bỏ qua giai đoạn khởi tạo
      this.apply();
    },

    /** Cấu hình hiệu lực = mức + công tắc người dùng + giảm chuyển động */
    cfg() {
      const c = Object.assign({ tier: this.tier }, TIERS[this.tier]);
      if (!this.toggles.shader) c.shader = 'off';
      if (!this.toggles.particles) c.particles = 0;
      if (!this.toggles.parallax || this.reduced) c.parallax = false;
      if (this.reduced) { c.transitions = 'lite'; c.blur = false; }
      if (this.stats.webgl === false) c.shader = 'off';
      return c;
    },

    apply() {
      const c = this.cfg();
      document.documentElement.dataset.tier = this.tier;
      document.documentElement.dataset.trans = c.transitions;
      document.documentElement.classList.toggle('no-blur', !c.blur);
      App.bus.emit('quality', c);
    },

    setMode(mode) {
      this.mode = mode;
      if (mode !== 'auto') this.tier = mode;
      else { this.tier = this.reduced ? 'performance' : 'high'; this._graceUntil = performance.now() + 2500; this._bad = 0; }
      this.save();
      this.apply();
    },
    setToggle(k, v) { this.toggles[k] = v; this.save(); this.apply(); },
    save() { U.store.set(KEY, JSON.stringify({ mode: this.mode, toggles: this.toggles })); },

    /** Gọi từ loop mỗi khung hình với dt thực đo giữa 2 lần rAF */
    sample(dt, now) {
      if (dt <= 0 || dt > 250) return; // tab vừa quay lại / bị treo — không tính
      const w = this._win;
      if (!w.t0) w.t0 = now;
      w.frames++; w.sum += dt;
      if (dt > 40) w.long++;
      if (now - w.t0 >= 2000) {
        const fps = (w.frames * 1000) / (now - w.t0);
        this.stats.fps = Math.round(fps);
        this.stats.frameMs = +(w.sum / w.frames).toFixed(1);
        this.stats.drops += w.long;
        const bad = fps < 40 || w.long > w.frames * 0.15;
        if (this.mode === 'auto' && now > this._graceUntil && now > this._cooldownUntil) {
          this._bad = bad ? this._bad + 1 : 0;
          if (this._bad >= 2) this.downgrade('FPS trung bình ' + Math.round(fps) + ' trong 4 giây');
        }
        App.bus.emit('fps', this.stats);
        w.t0 = now; w.frames = 0; w.sum = 0; w.long = 0;
      }
    },

    downgrade(reason) {
      const i = ORDER.indexOf(this.tier);
      if (i >= ORDER.length - 1) return;
      this.tier = ORDER[i + 1];
      this._bad = 0;
      this._cooldownUntil = performance.now() + 6000;
      this.stats.downgrades.push({ to: this.tier, reason, at: new Date().toLocaleTimeString('vi-VN') });
      console.info('[quality] hạ mức →', this.tier, '(' + reason + ')');
      this.apply();
      U.toast('Tự động chuyển sang mức <b>' + TIERS[this.tier].label + '</b> để giữ trình chiếu mượt.');
    },
  };
  App.quality = Q;
})();

</script>
<script data-app-module="loop">
/* ==========================================================================
   loop.js — MỘT vòng requestAnimationFrame duy nhất cho toàn bộ ứng dụng.
   - Mỗi tác vụ (background, particles, glow/parallax, tween) đăng ký với FPS
     riêng; vòng lặp tự dừng khi không còn tác vụ nào hoạt động.
   - Tự tạm dừng khi tab bị ẩn (document.hidden).
   - Cung cấp tween ngắn hạn cho bộ đếm số, cán cân... thay vì tạo rAF riêng.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App;
  const tasks = [];
  const tweens = [];
  let raf = 0, last = 0, running = false;

  function add(name, fn, fps) {
    const t = { name, fn, fps: fps || 60, last: 0, on: false };
    tasks.push(t);
    return t;
  }
  function set(t, on) {
    if (!t) return;
    t.on = !!on;
    if (on) t.last = 0;
    ensure();
  }
  function setFps(t, fps) { if (t) t.fps = fps; }

  function hasWork() { return tweens.length > 0 || tasks.some((t) => t.on); }

  function ensure() {
    const want = hasWork() && !document.hidden;
    if (want && !running) {
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    } else if (!want && running) {
      running = false;
      cancelAnimationFrame(raf);
    }
  }

  function frame(now) {
    if (!running) return;
    const dt = now - last;
    last = now;
    if (App.quality) App.quality.sample(dt, now);

    // Tween: chạy mỗi khung hình (60fps) — chỉ tồn tại trong thời gian ngắn
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (!tw.start) tw.start = now;
      const k = Math.min(1, (now - tw.start) / tw.ms);
      const e = tw.ease ? tw.ease(k) : 1 - Math.pow(1 - k, 3);
      try { tw.fn(e, k); } catch (err) { console.error('[tween]', err); }
      if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
    }

    for (let i = 0; i < tasks.length; i++) {
      const t = tasks[i];
      if (!t.on) continue;
      const iv = t.fps >= 60 ? 0 : 1000 / t.fps;
      if (!t.last || now - t.last >= iv - 2) {
        const tdt = t.last ? now - t.last : 16.7;
        t.last = now;
        try { t.fn(now, Math.min(tdt, 100)); }
        catch (err) { console.error('[loop] tác vụ lỗi, đã tắt:', t.name, err); t.on = false; }
      }
    }
    if (!hasWork()) { running = false; return; }
    raf = requestAnimationFrame(frame);
  }

  /** Tween dùng chung vòng lặp. Trả về hàm huỷ. */
  function tween(ms, fn, done, ease) {
    const tw = { ms: Math.max(1, ms), fn, done, ease, start: 0 };
    tweens.push(tw);
    ensure();
    return () => { const i = tweens.indexOf(tw); if (i >= 0) tweens.splice(i, 1); };
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { running = false; cancelAnimationFrame(raf); }
    else ensure();
  });

  App.loop = { add, set, setFps, ensure, tween, get running() { return running; }, get taskList() { return tasks; } };
})();

</script>
<script data-app-module="webgl-bg">
/* ==========================================================================
   webgl-bg.js — Nền shader procedural dùng MỘT WebGL context duy nhất.
   - Domain-warped fBm (dải tinh vân) + tia sáng tán xạ + vignette + grain.
   - Bảng màu theo từng phần (A/B/C/D), nội suy mượt khi đổi phần.
   - Hiệu ứng "pulse" (gợn sóng biến dạng) khi chuyển phần → shader transition.
   - Render ở độ phân giải thấp (glScale) và FPS giới hạn; mức performance chỉ
     render 1 lần khi thay đổi (tĩnh). Không render khi không có gì thay đổi.
   - Lỗi/mất context → tự chuyển sang nền CSS (fallback), không làm hỏng slide.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util;

  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  // Bảng màu nền tối (để chữ luôn dễ đọc)
  const PAL = {
    A: { base: hex('#04050d'), a: hex('#1a1d5c'), b: hex('#3a1a66'), c: hex('#ffb547') },
    B: { base: hex('#030c10'), a: hex('#0a3540'), b: hex('#0f4a52'), c: hex('#4fd1e8') },
    C: { base: hex('#0d050f'), a: hex('#3a1036'), b: hex('#4f1a33'), c: hex('#ff8a5c') },
    D: { base: hex('#06060e'), a: hex('#272051'), b: hex('#3e3010'), c: hex('#ffd36b') },
  };

  const VERT = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const frag = (oct) => `precision mediump float;
#define OCT ${oct}
uniform vec2 uRes;uniform float uTime;uniform vec3 uBase,uA,uB,uC;uniform vec2 uMouse;uniform float uPulse;uniform float uGrain;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
 return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<OCT;i++){v+=a*noise(p);p=m*p;a*=.5;}return v;}
void main(){
 vec2 uv=gl_FragCoord.xy/uRes;
 vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y;
 p+=uMouse*.035;
 float d=length(p);
 p+=normalize(p+1e-4)*uPulse*sin(d*16.-uPulse*9.)*exp(-d*2.2)*.07;
 float t=uTime*.035;
 vec2 q=vec2(fbm(p*1.3+t),fbm(p*1.3+vec2(5.2,1.3)-t));
 vec2 r=vec2(fbm(p*1.5+2.8*q+vec2(1.7,9.2)+t*1.2),fbm(p*1.5+2.8*q+vec2(8.3,2.8)-t));
 float f=fbm(p*1.15+2.4*r);
 vec3 col=mix(uBase,uA,smoothstep(.25,.95,f));
 col=mix(col,uB,smoothstep(.45,1.1,length(q))*.6);
 col+=uC*pow(max(0.,r.x-.25),2.6)*.32;
 vec2 dir=p-vec2(-1.05,.72);
 float ang=atan(dir.y,dir.x);
 float beams=.5+.5*sin(ang*21.+t*5.+noise(vec2(ang*3.,t))*3.);
 col+=uC*beams*exp(-length(dir)*1.25)*.10;
 col+=uC*uPulse*exp(-d*3.)*.18;
 vec2 v=uv-.5;col*=1.-dot(v,v)*1.15;
 col+=(hash(gl_FragCoord.xy+fract(uTime*7.))-.5)*uGrain;
 gl_FragColor=vec4(col,1.);
}`;

  const BG = {
    ok: false, gl: null, canvas: null, fallback: null,
    prog: null, uni: {}, task: null, cfg: null, oct: 0,
    cur: null, tgt: null, sec: 'A',
    time: 0, pulse: 0, mouse: [0, 0], mouseT: [0, 0],
    staticDirty: true, initMs: 0,

    init(canvas, fallback) {
      this.canvas = canvas; this.fallback = fallback;
      this.cur = U.clone(PAL.A); this.tgt = PAL.A;
      const t0 = performance.now();
      try {
        const opts = { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false, powerPreference: 'default' };
        // Ưu tiên GPU thật: nếu trình duyệt chỉ có WebGL phần mềm (SwiftShader…) thì getContext trả null
        // → dùng nền CSS. Thêm ?gl=force vào URL để vẫn bật WebGL phần mềm.
        const force = /[?&]gl=force/.test(location.search);
        let gl = canvas.getContext('webgl', Object.assign({ failIfMajorPerformanceCaveat: !force }, opts));
        if (!gl) {
          const probe = document.createElement('canvas').getContext('webgl', opts);
          App.quality.stats.webglSoftware = !!probe;
          if (probe) { const ext = probe.getExtension('WEBGL_lose_context'); ext && ext.loseContext(); }
          throw new Error(probe ? 'WebGL chỉ chạy bằng phần mềm (CPU)' : 'WebGL không khả dụng');
        }
        this.gl = gl;
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW); // 1 tam giác phủ màn hình
        this.ok = true;
        canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.lost(); });
        canvas.addEventListener('webglcontextrestored', () => { this.oct = 0; this.ok = true; this.init(canvas, fallback); this.applyQuality(App.quality.cfg()); });
      } catch (e) {
        console.warn('[bg] ', e.message, '→ dùng nền CSS');
        this.ok = false;
      }
      if (this.ok && App.quality.mode === 'auto' && !App.quality.reduced) {
        try { this.benchmark(); } catch (e) { console.warn('[bg] benchmark lỗi', e); }
      }
      this.initMs = Math.round(performance.now() - t0);
      App.quality.stats.webgl = this.ok;
      App.quality.stats.initMs = this.initMs;
      if (!this.task) this.task = App.loop.add('webgl-bg', (now, dt) => this.frame(now, dt), 30);
      if (!this._wired) {
        this._wired = true;
        App.bus.on('quality', (c) => this.applyQuality(c));
        window.addEventListener('resize', U.debounce(() => { this.resize(); this.staticDirty = true; this.kick(); }, 150));
      }
    },

    compile(oct) {
      const gl = this.gl;
      const mk = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const vs = mk(gl.VERTEX_SHADER, VERT), fs = mk(gl.FRAGMENT_SHADER, frag(oct));
      const p = gl.createProgram();
      gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
      gl.deleteShader(vs); gl.deleteShader(fs);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
      if (this.prog) gl.deleteProgram(this.prog); // giải phóng chương trình cũ, KHÔNG tạo lại context
      this.prog = p; this.oct = oct;
      gl.useProgram(p);
      const loc = gl.getAttribLocation(p, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      ['uRes', 'uTime', 'uBase', 'uA', 'uB', 'uC', 'uMouse', 'uPulse', 'uGrain'].forEach((n) => (this.uni[n] = gl.getUniformLocation(p, n)));
    },

    /**
     * Đo khả năng render THỰC TẾ (không dựa vào tên GPU): vẽ thử shader ở cấu hình
     * High rồi Balanced, chờ GPU xong (readPixels đồng bộ) và đo thời gian mỗi khung.
     */
    benchmark() {
      const gl = this.gl, Q = App.quality;
      const timeAt = (oct, target) => {
        this.compile(oct);
        // Vẽ thử ở độ phân giải nhỏ rồi quy đổi theo số pixel (shader nền bị giới hạn bởi fragment)
        const scale = Math.min(target, 0.2);
        const w = Math.max(64, Math.round(window.innerWidth * scale)), hh = Math.max(36, Math.round(window.innerHeight * scale));
        this.canvas.width = w; this.canvas.height = hh; gl.viewport(0, 0, w, hh);
        const u = this.uni;
        gl.uniform2f(u.uRes, w, hh); gl.uniform3fv(u.uBase, this.cur.base); gl.uniform3fv(u.uA, this.cur.a);
        gl.uniform3fv(u.uB, this.cur.b); gl.uniform3fv(u.uC, this.cur.c); gl.uniform2f(u.uMouse, 0, 0); gl.uniform1f(u.uPulse, 0); gl.uniform1f(u.uGrain, 0.02);
        const px = new Uint8Array(4);
        const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); // buộc chờ GPU vẽ xong
        gl.uniform1f(u.uTime, 1); gl.drawArrays(gl.TRIANGLES, 0, 3); sync(); // khởi động (biên dịch lười)
        const t = performance.now();
        for (let i = 0; i < 3; i++) { gl.uniform1f(u.uTime, 2 + i); gl.drawArrays(gl.TRIANGLES, 0, 3); sync(); }
        return ((performance.now() - t) / 3) * ((target * target) / (scale * scale));
      };
      const hi = Q.TIERS.high, ba = Q.TIERS.balanced;
      const tHigh = timeAt(hi.octaves, hi.glScale);
      let tier = 'high', tBal = null;
      if (tHigh > 9) { tBal = timeAt(ba.octaves, ba.glScale); tier = tBal > 9 ? 'performance' : 'balanced'; }
      Q.stats.benchHigh = +tHigh.toFixed(1); Q.stats.benchBal = tBal == null ? null : +tBal.toFixed(1);
      Q.tier = tier;
      console.info('[bg] benchmark: High', tHigh.toFixed(1), 'ms/khung', tBal != null ? '· Balanced ' + tBal.toFixed(1) + ' ms' : '', '→ mức', tier);
    },

    resize() {
      if (!this.ok || !this.cfg) return;
      const s = this.cfg.glScale || 0.4;
      const w = Math.max(64, Math.round(window.innerWidth * s));
      const h = Math.max(36, Math.round(window.innerHeight * s));
      if (this.canvas.width !== w || this.canvas.height !== h) {
        this.canvas.width = w; this.canvas.height = h;
        this.gl.viewport(0, 0, w, h);
      }
    },

    applyQuality(c) {
      this.cfg = c;
      const useGL = this.ok && c.shader !== 'off';
      this.canvas.style.display = useGL ? 'block' : 'none';
      this.fallback.style.display = useGL ? 'none' : 'block';
      if (!useGL) { App.loop.set(this.task, false); this.baked = false; this.fallback.style.backgroundImage = ''; return; }
      if (c.shader === 'live') this.unbake();
      try { if (this.oct !== c.octaves) this.compile(c.octaves); }
      catch (e) { console.warn('[bg] lỗi shader → fallback', e); this.ok = false; App.quality.stats.webgl = false; return this.applyQuality(c); }
      this.resize();
      App.loop.setFps(this.task, c.glFps || 30);
      this.staticDirty = true;
      this.kick();
    },

    /** Bật/tắt vòng render tuỳ chế độ */
    kick() {
      if (!this.ok || !this.cfg || this.cfg.shader === 'off') return;
      if (this.cfg.shader === 'live') App.loop.set(this.task, true);
      else { // tĩnh: render 1 khung rồi nướng thành ảnh nền
        if (this.baked) { this.canvas.style.display = 'block'; }
        App.loop.setFps(this.task, 30);
        App.loop.set(this.task, true);
      }
    },

    setSection(sec, pulse) {
      // Mức tĩnh: cùng phần → ảnh nền đã nướng vẫn đúng, không cần render lại
      if (this.baked && sec === this.sec && this.cfg && this.cfg.shader === 'static') return;
      this.sec = sec;
      this.tgt = PAL[sec] || PAL.A;
      this.fallback.dataset.section = sec;
      if (pulse && this.cfg && this.cfg.transitions === 'full') this.pulse = 1;
      this.staticDirty = true;
      this.kick();
    },

    setMouse(x, y) { this.mouseT[0] = x; this.mouseT[1] = y; },

    frame(now, dt) {
      const gl = this.gl;
      if (!this.ok || !this.prog || gl.isContextLost()) return;
      const live = this.cfg.shader === 'live';
      const k = live ? 1 - Math.exp(-dt / 380) : 1; // tĩnh: không nội suy, render 1 khung
      let moving = false;
      for (const key of ['base', 'a', 'b', 'c']) {
        for (let i = 0; i < 3; i++) {
          const d = this.tgt[key][i] - this.cur[key][i];
          if (Math.abs(d) > 0.002) moving = true;
          this.cur[key][i] += d * k;
        }
      }
      if (this.pulse > 0) { this.pulse = Math.max(0, this.pulse - dt / 1400); moving = true; }
      if (live) {
        this.time += dt / 1000;
        if (this.cfg.parallax) {
          this.mouse[0] += (this.mouseT[0] - this.mouse[0]) * Math.min(1, dt / 220);
          this.mouse[1] += (this.mouseT[1] - this.mouse[1]) * Math.min(1, dt / 220);
        }
      }
      const u = this.uni;
      gl.uniform2f(u.uRes, this.canvas.width, this.canvas.height);
      gl.uniform1f(u.uTime, live ? this.time : 12.0);
      gl.uniform3fv(u.uBase, this.cur.base); gl.uniform3fv(u.uA, this.cur.a);
      gl.uniform3fv(u.uB, this.cur.b); gl.uniform3fv(u.uC, this.cur.c);
      gl.uniform2f(u.uMouse, this.mouse[0], this.mouse[1]);
      gl.uniform1f(u.uPulse, this.pulse);
      gl.uniform1f(u.uGrain, live ? 0.022 : 0.0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (!live && !moving) { this.staticDirty = false; App.loop.set(this.task, false); this.bake(); } // tĩnh: dừng khi đã ổn định
    },

    /** Mức Hiệu năng: chụp khung shader đã render thành ảnh nền CSS rồi ẩn canvas
        → không còn lớp WebGL phải ghép (composite) mỗi khung hình. */
    bake() {
      try {
        const url = this.canvas.toDataURL('image/jpeg', 0.9); // gọi ngay sau drawArrays, cùng tác vụ
        this.fallback.style.backgroundImage = `url(${url})`;
        this.fallback.style.backgroundSize = 'cover';
        this.fallback.style.display = 'block';
        this.canvas.style.display = 'none';
        this.baked = true;
      } catch (e) { /* giữ canvas */ }
    },
    unbake() {
      if (!this.baked) return;
      this.baked = false;
      this.fallback.style.backgroundImage = '';
      this.canvas.style.display = 'block';
      this.fallback.style.display = 'none';
    },

    lost() {
      console.warn('[bg] mất WebGL context → nền CSS');
      this.ok = false; this.prog = null;
      App.loop.set(this.task, false);
      this.canvas.style.display = 'none';
      this.fallback.style.display = 'block';
    },
  };
  App.bg = BG;
})();

</script>
<script data-app-module="particles">
/* ==========================================================================
   particles.js — Hệ hạt Canvas 2D dùng chung cho mọi slide.
   - Bộ nhớ cấp phát 1 lần (Float32Array), không tạo object mới mỗi khung.
   - Hạt có chiều sâu (z) → kích thước, độ sáng, parallax theo chuột.
   - Chế độ: 'network' (nối đường), 'drift' (chỉ trôi), 'off'.
   - Đường nối được gom theo 3 mức alpha → chỉ 3 lệnh stroke mỗi khung.
   - Số hạt, FPS, DPR theo mức chất lượng; tắt khi tab ẩn (loop tự dừng).
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util;
  const MAX = 160;

  const P = {
    cv: null, ctx: null, w: 0, h: 0, dpr: 1, n: 0, task: null, cfg: null,
    X: new Float32Array(MAX), Y: new Float32Array(MAX), Z: new Float32Array(MAX),
    VX: new Float32Array(MAX), VY: new Float32Array(MAX),
    mode: 'drift', density: 1, color: [255, 200, 120], alpha: 1,
    mx: -9999, my: -9999, px: 0, py: 0,
    segs: [[], [], []],

    init(canvas) {
      this.cv = canvas;
      this.ctx = canvas.getContext('2d', { alpha: true });
      for (let i = 0; i < MAX; i++) this.seed(i, true);
      this.task = App.loop.add('particles', (now, dt) => this.frame(dt), 30);
      App.bus.on('quality', (c) => this.applyQuality(c));
      window.addEventListener('resize', U.debounce(() => this.resize(), 150));
    },

    seed(i, any) {
      const W = this.w || window.innerWidth, H = this.h || window.innerHeight;
      this.X[i] = Math.random() * W;
      this.Y[i] = any ? Math.random() * H : H + 10;
      this.Z[i] = 0.25 + Math.random() * 0.75;
      const sp = 0.012 + Math.random() * 0.02;
      const a = Math.random() * Math.PI * 2;
      this.VX[i] = Math.cos(a) * sp;
      this.VY[i] = Math.sin(a) * sp - 0.006;
    },

    resize() {
      if (!this.cfg) return;
      this.dpr = Math.min(window.devicePixelRatio || 1, this.cfg.dpr || 1);
      const W = window.innerWidth, H = window.innerHeight;
      const sx = this.w ? W / this.w : 1, sy = this.h ? H / this.h : 1;
      for (let i = 0; i < MAX; i++) { this.X[i] *= sx; this.Y[i] *= sy; }
      this.w = W; this.h = H;
      this.cv.width = Math.round(W * this.dpr);
      this.cv.height = Math.round(H * this.dpr);
      this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    },

    applyQuality(c) {
      this.cfg = c;
      this.resize();
      App.loop.setFps(this.task, c.pFps || 30);
      this.update();
    },

    /** Gọi khi đổi slide: mode, mật độ (0..1), màu nhấn */
    setMode(mode, density, colorHex) {
      this.mode = mode || 'drift';
      this.density = density == null ? 1 : density;
      if (colorHex) this.color = [1, 3, 5].map((i) => parseInt(colorHex.slice(i, i + 2), 16));
      this.update();
    },

    update() {
      if (!this.cfg) return;
      this.n = this.mode === 'off' ? 0 : Math.round((this.cfg.particles || 0) * this.density);
      const on = this.n > 0;
      this.cv.style.opacity = on ? '1' : '0';
      if (!on) this.ctx.clearRect(0, 0, this.w, this.h);
      App.loop.set(this.task, on);
    },

    setMouse(clientX, clientY, nx, ny) { this.mx = clientX; this.my = clientY; this.px = nx; this.py = ny; },

    frame(dt) {
      const ctx = this.ctx, n = this.n, W = this.w, H = this.h;
      const { X, Y, Z, VX, VY } = this;
      ctx.clearRect(0, 0, W, H);
      const par = this.cfg.parallax ? 1 : 0;
      const ox = -this.px * 26 * par, oy = -this.py * 18 * par;
      const mx = this.mx, my = this.my, R = 150, R2 = R * R;
      const [r, g, b] = this.color;

      // Cập nhật vị trí + đẩy nhẹ quanh con trỏ
      for (let i = 0; i < n; i++) {
        X[i] += VX[i] * dt * Z[i];
        Y[i] += VY[i] * dt * Z[i];
        const dx = X[i] - mx, dy = Y[i] - my, d2 = dx * dx + dy * dy;
        if (d2 < R2 && d2 > 1) { const f = (1 - d2 / R2) * 0.9 * Z[i]; const d = Math.sqrt(d2); X[i] += (dx / d) * f; Y[i] += (dy / d) * f; }
        if (X[i] < -40) X[i] = W + 40; else if (X[i] > W + 40) X[i] = -40;
        if (Y[i] < -40) Y[i] = H + 40; else if (Y[i] > H + 40) Y[i] = -40;
      }

      // Đường nối (O(n²) với n ≤ 110 ⇒ ≤ 6 000 phép so sánh, rất nhẹ)
      if (this.mode === 'network' && this.cfg.lines) {
        const L = 135, L2 = L * L, s = this.segs;
        s[0].length = s[1].length = s[2].length = 0;
        for (let i = 0; i < n; i++) {
          const xi = X[i] + ox * Z[i], yi = Y[i] + oy * Z[i];
          for (let j = i + 1; j < n; j++) {
            const xj = X[j] + ox * Z[j], yj = Y[j] + oy * Z[j];
            const dx = xi - xj, dy = yi - yj, d2 = dx * dx + dy * dy;
            if (d2 < L2) { const k = d2 < L2 * 0.25 ? 0 : d2 < L2 * 0.6 ? 1 : 2; s[k].push(xi, yi, xj, yj); }
          }
        }
        ctx.lineWidth = 1;
        const al = [0.20, 0.11, 0.05];
        for (let k = 0; k < 3; k++) {
          const a = s[k]; if (!a.length) continue;
          ctx.strokeStyle = `rgba(${r},${g},${b},${al[k]})`;
          ctx.beginPath();
          for (let m = 0; m < a.length; m += 4) { ctx.moveTo(a[m], a[m + 1]); ctx.lineTo(a[m + 2], a[m + 3]); }
          ctx.stroke();
        }
      }

      // Hạt: gom theo 2 lớp sáng để giảm đổi fillStyle
      for (let layer = 0; layer < 2; layer++) {
        ctx.fillStyle = layer ? `rgba(${r},${g},${b},0.85)` : 'rgba(220,230,255,0.45)';
        ctx.beginPath();
        for (let i = layer; i < n; i += 2) {
          const z = Z[i], x = X[i] + ox * z, y = Y[i] + oy * z, rad = 0.6 + z * 1.7;
          ctx.moveTo(x + rad, y);
          ctx.arc(x, y, rad, 0, Math.PI * 2);
        }
        ctx.fill();
      }
    },
  };
  App.particles = P;
})();

</script>
<script data-app-module="widgets-core">
/* ==========================================================================
   widgets-core.js — Registry widget + các widget minh hoạ cơ bản.
   Mỗi widget: { label, steps(data), defaults(), editor, mount(host,data,ctx) }
   mount() trả về instance: { setStep(s, animate), activate(), deactivate(), destroy() }
   - s là bước (step) hiện tại của slide. Widget tự quyết định hiện gì ở bước nào.
   - Animation CSS của slide không active bị pause (xem slides.css).
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h, s = U.s;

  const W = (App.widgets = {
    reg: {},
    // Bảng màu nhóm (đã kiểm định CVD trên nền tối #0B0F1E)
    CAT: ['#16A0BA', '#E5536E', '#5E7BF0', '#C08A10', '#A065E8', '#2E9F58'],
    register(name, def) { this.reg[name] = def; },
    has(name) { return !!this.reg[name]; },
    steps(name, data) { const d = this.reg[name]; try { return d && d.steps ? d.steps(data || {}) : 0; } catch (e) { return 0; } },
    mount(name, host, data, ctx) {
      const def = this.reg[name];
      if (!def) { host.append(h('div', { class: 'w-missing' }, 'Widget không tồn tại: ' + name)); return null; }
      try { return def.mount(host, data || {}, ctx || {}); }
      catch (e) {
        console.error('[widget]', name, e);
        host.append(h('div', { class: 'w-missing' }, 'Lỗi hiển thị widget (' + name + '): ' + e.message));
        return null;
      }
    },
  });

  /** Bật/tắt lớp .on cho các phần tử [data-s] theo bước. animate=false → không transition */
  W.stepper = function (root) {
    return function (st, animate) {
      if (!animate) root.classList.add('instant');
      root.querySelectorAll('[data-s]').forEach((n) => n.classList.toggle('on', st >= +n.dataset.s));
      if (!animate) { void root.offsetWidth; setTimeout(() => root.classList.remove('instant'), 30); }
    };
  };
  W.niceStep = function (max, maxTicks) {
    const raw = max / (maxTicks || 5);
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= raw) return m * p;
    return 10 * p;
  };
  /** Văn bản SVG có chỉ số dưới: parts = ['x', {sub:'i'}] */
  W.stext = function (attrs, parts) {
    const t = s('text', attrs);
    (Array.isArray(parts) ? parts : [parts]).forEach((p) => {
      if (typeof p === 'string') t.append(s('tspan', {}, p));
      else if (p.sub) { t.append(s('tspan', { 'baseline-shift': 'sub', 'font-size': '72%' }, p.sub)); t.append(s('tspan', { 'baseline-shift': '0' }, ' ')); }
    });
    return t;
  };
  W.groupsOf = (d) => (d.groups || []).map((g, i, a) => Object.assign({}, g, { label: g.label || U.groupLabel(g, i === a.length - 1 && d.closedLast) }));

  /* ------------------------------------------------------------------ hero */
  W.register('heroviz', {
    label: 'Hình nền hero',
    steps: () => 0,
    defaults: () => ({}),
    mount(host, d, ctx) {
      const w = ctx.w, hh = ctx.h, cx = w * 0.52, cy = hh * 0.46;
      const bars = [0.10, 0.18, 0.32, 0.52, 0.78, 0.96, 0.84, 0.6, 0.38, 0.2, 0.1];
      const base = hh * 0.80, bw = (w * 0.86) / bars.length, x0 = w * 0.07;
      const svg = s('svg', { viewBox: `0 0 ${w} ${hh}`, class: 'heroviz' },
        s('defs', {},
          s('linearGradient', { id: 'hvg', x1: '0', y1: '1', x2: '0', y2: '0' },
            s('stop', { offset: '0', style: 'stop-color:var(--acc2);stop-opacity:.15' }),
            s('stop', { offset: '1', style: 'stop-color:var(--acc);stop-opacity:.95' })),
          s('radialGradient', { id: 'hvglow' }, s('stop', { offset: '0', style: 'stop-color:var(--acc);stop-opacity:.35' }), s('stop', { offset: '1', style: 'stop-color:var(--acc);stop-opacity:0' }))),
        s('circle', { cx, cy, r: Math.min(w, hh) * 0.42, fill: 'url(#hvglow)' }));
      // Quỹ đạo xoay: lớp HTML riêng (composited) → xoay bằng GPU, không vẽ lại SVG mỗi khung
      const R1 = Math.min(w, hh) * 0.40, R2 = Math.min(w, hh) * 0.30;
      const ring = (r, cls) => h('div', { class: 'hv-orb ' + cls, style: { left: (cx - r) + 'px', top: (cy - r) + 'px', width: 2 * r + 'px', height: 2 * r + 'px' } }, h('i'));
      const g = s('g', { class: 'hv-bars' });
      bars.forEach((v, i) => {
        const bh = v * hh * 0.55;
        g.append(s('rect', { x: x0 + i * bw + 3, y: base - bh, width: bw - 6, height: bh, rx: 4, class: 'hv-bar', style: `--i:${i}` }));
      });
      svg.append(g);
      // Đường cong mượt đi qua đỉnh cột
      let dPath = '';
      bars.forEach((v, i) => {
        const px = x0 + i * bw + bw / 2, py = base - v * hh * 0.55 - 18;
        dPath += (i ? ' L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
      });
      svg.append(s('path', { d: dPath, class: 'hv-curve', pathLength: 1 }));
      const mx = x0 + 5.35 * bw;
      svg.append(s('line', { x1: mx, x2: mx, y1: base - hh * 0.62, y2: base + 10, class: 'hv-mean' }));
      svg.append(s('text', { x: mx + 16, y: base - hh * 0.565, class: 'hv-lbl' }, 'x'));
      svg.append(s('line', { x1: mx + 18, x2: mx + 38, y1: base - hh * 0.565 - 34, y2: base - hh * 0.565 - 34, class: 'hv-bar-l' }));
      svg.append(s('line', { x1: x0 - 10, x2: x0 + bars.length * bw + 10, y1: base, y2: base, class: 'hv-axis' }));
      host.append(ring(R1, 'o1 spin-slow'), ring(R2, 'o2 spin-rev'), svg);
      return {
        setStep() {},
        activate() { svg.classList.add('play'); },
        deactivate() {},
        destroy() { svg.remove(); },
      };
    },
  });

  /* ------------------------------------------------------------------ journey */
  W.register('journey', {
    label: 'Đường hành trình',
    steps: () => 0,
    defaults: () => ({ nodes: 3 }),
    mount(host, d, ctx) {
      const w = ctx.w, hh = ctx.h, n = d.nodes || 3, y = hh * 0.55;
      const xs = Array.from({ length: n }, (_, i) => w * (0.5 / n + i / n));
      let p = `M0 ${y}`;
      for (let i = 0; i < 4; i++) {
        const x1 = (w / 4) * i, x2 = (w / 4) * (i + 1);
        p += ` C ${x1 + w / 12} ${y - hh * 0.35}, ${x2 - w / 12} ${y + hh * 0.35}, ${x2} ${y}`;
      }
      const svg = s('svg', { viewBox: `0 0 ${w} ${hh}`, class: 'journey' },
        s('defs', {}, s('linearGradient', { id: 'jg', x1: 0, x2: 1 },
          s('stop', { offset: 0, style: 'stop-color:var(--acc2)' }), s('stop', { offset: 1, style: 'stop-color:var(--acc)' }))),
        s('path', { d: p, class: 'j-path-bg' }),
        s('path', { d: p, class: 'j-path', pathLength: 1 }));
      xs.forEach((x, i) => {
        svg.append(s('g', { class: 'j-node', style: `--i:${i}` },
          s('circle', { cx: x, cy: y, r: 30, class: 'j-halo' }),
          s('circle', { cx: x, cy: y, r: 13, class: 'j-dot' }),
          s('text', { x, y: y - 48, class: 'j-num', 'text-anchor': 'middle' }, '0' + (i + 1))));
      });
      host.append(svg);
      return { setStep() {}, activate() { svg.classList.add('play'); }, deactivate() {}, destroy() { svg.remove(); } };
    },
  });

  /* ------------------------------------------------------------------ interval */
  W.register('interval', {
    label: 'Sơ đồ nhóm [a; b)',
    steps: (d) => Math.max(0, ...(Object.values(d.at || {}).map(Number))),
    defaults: () => ({ mode: 'basic', at: {} }),
    mount(host, d, ctx) {
      const w = ctx.w, hh = ctx.h, y = hh * 0.52;
      const xa = w * 0.2, xb = w * 0.8, at = d.at || {};
      const svg = s('svg', { viewBox: `0 0 ${w} ${hh}`, class: 'interval' });
      svg.append(s('line', { x1: 20, x2: w - 20, y1: y, y2: y, class: 'iv-axis' }));
      svg.append(s('polygon', { points: `${w - 20},${y} ${w - 34},${y - 8} ${w - 34},${y + 8}`, class: 'iv-arrow' }));
      svg.append(s('line', { x1: xa, x2: xb, y1: y, y2: y, class: 'iv-seg', pathLength: 1 }));
      const lblA = d.mode === 'midpoint' ? ['a', { sub: 'i' }] : ['a'];
      const lblB = d.mode === 'midpoint' ? ['a', { sub: 'i+1' }] : ['b'];
      svg.append(s('circle', { cx: xa, cy: y, r: 13, class: 'iv-closed' }));
      svg.append(s('circle', { cx: xb, cy: y, r: 13, class: 'iv-open' }));
      svg.append(W.stext({ x: xa, y: y + 62, class: 'iv-lbl', 'text-anchor': 'middle' }, lblA));
      svg.append(W.stext({ x: xb, y: y + 62, class: 'iv-lbl', 'text-anchor': 'middle' }, lblB));
      if (d.mode === 'midpoint') {
        const xm = (xa + xb) / 2;
        const g = s('g', { class: 'ws', 'data-s': at.mid || 0 },
          s('line', { x1: xm, x2: xm, y1: y - 70, y2: y + 18, class: 'iv-mid' }),
          s('circle', { cx: xm, cy: y, r: 10, class: 'iv-midpt' }),
          W.stext({ x: xm, y: y - 88, class: 'iv-lbl acc', 'text-anchor': 'middle' }, ['x', { sub: 'i' }]),
          s('text', { x: (xa + xm) / 2, y: y - 22, class: 'iv-small', 'text-anchor': 'middle' }, 'bằng nhau'),
          s('text', { x: (xm + xb) / 2, y: y - 22, class: 'iv-small', 'text-anchor': 'middle' }, 'bằng nhau'));
        svg.append(g);
      } else {
        svg.append(s('text', { x: xa, y: y - 34, class: 'iv-small', 'text-anchor': 'middle' }, 'thuộc nhóm'));
        svg.append(s('text', { x: xb, y: y - 34, class: 'iv-small', 'text-anchor': 'middle' }, 'không thuộc nhóm'));
        const yb = y + 112;
        svg.append(s('g', { class: 'ws', 'data-s': at.len || 0 },
          s('line', { x1: xa, x2: xb, y1: yb, y2: yb, class: 'iv-dim' }),
          s('polygon', { points: `${xa},${yb} ${xa + 14},${yb - 7} ${xa + 14},${yb + 7}`, class: 'iv-arrow acc' }),
          s('polygon', { points: `${xb},${yb} ${xb - 14},${yb - 7} ${xb - 14},${yb + 7}`, class: 'iv-arrow acc' }),
          s('text', { x: (xa + xb) / 2, y: yb + 46, class: 'iv-lbl acc', 'text-anchor': 'middle' }, 'độ dài: b − a')));
      }
      host.append(svg);
      const set = W.stepper(svg);
      return { setStep: set, activate() { svg.classList.add('play'); }, deactivate() {}, destroy() { svg.remove(); } };
    },
  });

  /* ------------------------------------------------------------------ counter */
  W.register('counter', {
    label: 'Bộ đếm số',
    steps: () => 0,
    defaults: () => ({ to: 1000, label: 'Nhãn' }),
    editor: 'json',
    mount(host, d, ctx) {
      const num = h('div', { class: 'ct-num' }, U.fmt(d.to, 0).replace(/ /g, ' '));
      const root = h('div', { class: 'counter' }, num, d.label ? h('div', { class: 'ct-label', html: d.label }) : null);
      host.append(root);
      let cancel = null;
      const show = (v) => (num.textContent = U.fmt(Math.round(v), 0).replace(/ /g, ' '));
      return {
        setStep() {},
        activate() {
          if (ctx.static || App.quality.reduced) return show(d.to);
          cancel && cancel();
          cancel = App.loop.tween(d.dur || 1800, (e) => show(d.to * e), () => show(d.to), (k) => 1 - Math.pow(1 - k, 4));
        },
        deactivate() { cancel && cancel(); show(d.to); },
        destroy() { cancel && cancel(); root.remove(); },
      };
    },
  });

  /* ------------------------------------------------------------------ hbars */
  W.register('hbars', {
    label: 'Thanh ngang (tần số)',
    steps: (d) => +d.totalAt || 0,
    defaults: () => ({ items: [{ label: 'Nhóm A', value: 10 }, { label: 'Nhóm B', value: 20 }], totalAt: 1, unit: '' }),
    editor: 'json',
    mount(host, d) {
      const items = d.items || [];
      const max = Math.max(1, ...items.map((i) => +i.value || 0));
      const total = items.reduce((a, i) => a + (+i.value || 0), 0);
      const root = h('div', { class: 'hbars' });
      items.forEach((it, i) => {
        root.append(h('div', { class: 'hb-row', style: { '--i': i } },
          h('div', { class: 'hb-lbl', html: it.label }),
          h('div', { class: 'hb-track' }, h('div', { class: 'hb-fill', style: { width: ((+it.value / max) * 100).toFixed(2) + '%' } })),
          h('div', { class: 'hb-val' }, U.fmt(+it.value, 0).replace(/ /g, ' '))));
      });
      if (d.totalAt != null) {
        root.append(h('div', { class: 'hb-total ws', 'data-s': d.totalAt },
          h('span', {}, d.totalLabel || 'Tổng'), h('b', {}, U.fmt(total, 0).replace(/ /g, ' ') + (d.unit ? ' ' + d.unit : ''))));
      }
      host.append(root);
      const set = W.stepper(root);
      return { setStep: set, activate() { root.classList.add('play'); }, deactivate() {}, destroy() { root.remove(); } };
    },
  });

  /* ------------------------------------------------------------------ histogram (biểu đồ tần số) */
  W.register('histogram', {
    label: 'Biểu đồ tần số',
    steps: (d) => Math.max(+d.totalAt || 0, ...(d.highlights || []).map((x) => +x.at || 0), 0),
    defaults: () => ({ groups: [{ a: 0, b: 10, m: 4 }, { a: 10, b: 20, m: 7 }, { a: 20, b: 30, m: 5 }], xLabel: 'Nhóm', yLabel: 'Tần số', highlights: [], totalAt: null }),
    editor: 'groups',
    mount(host, d, ctx) {
      const gs = W.groupsOf(d), k = gs.length || 1;
      const w = ctx.w, hh = ctx.h;
      const pl = 92, pr = 24, pt = 56, pb = 118;
      const pw = w - pl - pr, ph = hh - pt - pb;
      const maxM = Math.max(1, ...gs.map((g) => +g.m || 0));
      const step = W.niceStep(maxM, 5), top = Math.ceil(maxM / step) * step;
      const y = (v) => pt + ph - (v / top) * ph;
      const slot = pw / k, bw = Math.min(slot - 2, slot * 0.82);
      const svg = s('svg', { viewBox: `0 0 ${w} ${hh}`, class: 'hist' });
      for (let v = 0; v <= top + 1e-9; v += step) {
        svg.append(s('line', { x1: pl, x2: w - pr, y1: y(v), y2: y(v), class: v ? 'grid' : 'axis' }));
        svg.append(s('text', { x: pl - 16, y: y(v) + 8, class: 'tick', 'text-anchor': 'end' }, U.fmt(v)));
      }
      const bars = [];
      gs.forEach((g, i) => {
        const x = pl + i * slot + (slot - bw) / 2, yt = y(+g.m), bh = pt + ph - yt;
        const r = Math.min(6, bw / 2, bh);
        const path = `M${x} ${pt + ph} V${yt + r} Q${x} ${yt} ${x + r} ${yt} H${x + bw - r} Q${x + bw} ${yt} ${x + bw} ${yt + r} V${pt + ph} Z`;
        const grp = s('g', { class: 'bar', style: `--i:${i}`, 'data-i': i },
          s('path', { d: path, class: 'bar-fill' }),
          s('text', { x: x + bw / 2, y: yt - 14, class: 'bar-val', 'text-anchor': 'middle' }, U.fmt(+g.m)),
          s('text', { x: x + bw / 2, y: pt + ph + 42, class: 'xlbl', 'text-anchor': 'middle' }, g.label),
          s('rect', { x: pl + i * slot, y: pt, width: slot, height: ph, class: 'hit' }));
        bars.push(grp);
        svg.append(grp);
      });
      if (d.xLabel) svg.append(s('text', { x: pl + pw / 2, y: hh - 18, class: 'axlbl', 'text-anchor': 'middle' }, d.xLabel));
      if (d.yLabel) svg.append(s('text', { x: pl - 4, y: pt - 24, class: 'axlbl', 'text-anchor': 'start' }, d.yLabel));
      if (d.totalAt != null) {
        const n = gs.reduce((a, g) => a + (+g.m || 0), 0);
        svg.append(s('text', { x: w - pr, y: pt - 22, class: 'hist-total ws', 'data-s': d.totalAt, 'text-anchor': 'end' }, (d.totalText || 'n = ') + U.fmt(n)));
      }
      // Tooltip khi rê chuột
      const tip = h('div', { class: 'w-tip' });
      const root = h('div', { class: 'w-root' }, svg, tip);
      bars.forEach((b, i) => {
        b.addEventListener('pointerenter', () => {
          const g = gs[i];
          tip.innerHTML = `<b>${g.label}</b><br>${d.yLabel || 'Tần số'}: ${U.fmt(+g.m)}`;
          const x = ((pl + i * slot + slot / 2) / w) * 100, yy = (y(+g.m) / hh) * 100;
          tip.style.left = x + '%'; tip.style.top = yy + '%';
          tip.classList.add('on');
        });
        b.addEventListener('pointerleave', () => tip.classList.remove('on'));
      });
      host.append(root);
      const hls = (d.highlights || []).slice().sort((a, b) => a.at - b.at);
      const setBase = W.stepper(svg);
      return {
        setStep(st, animate) {
          setBase(st, animate);
          let cur = null;
          hls.forEach((hl) => { if (st >= hl.at) cur = hl; });
          const idx = cur && cur.idx && cur.idx.length ? cur.idx : null;
          bars.forEach((b, i) => { b.classList.toggle('hl', !!idx && idx.includes(i)); b.classList.toggle('dim', !!idx && !idx.includes(i)); });
        },
        activate() { svg.classList.add('play'); },
        deactivate() {},
        destroy() { root.remove(); },
      };
    },
  });
})();

</script>
<script data-app-module="widgets-math">
/* ==========================================================================
   widgets-math.js — Widget toán học có giá trị sư phạm, tính toán TỪ DỮ LIỆU
   (sửa dữ liệu trong Editor → mọi con số, biểu đồ tự tính lại).
   - groupline : dữ liệu thô trên trục số → chia nhóm → chấm "rơi" vào nhóm.
   - meancalc  : bảng xᵢ, mᵢ, mᵢxᵢ + cán cân (điểm cân bằng = số trung bình).
   - cumlocate : dãy x₁…xₙ + cộng dồn tần số → nhóm chứa trung vị.
   - mediancalc: xác định nhóm p, thay số vào công thức, nội suy trong nhóm.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h, s = U.s, W = App.widgets;
  const sub = (b, i) => `${b}<sub>${i}</sub>`;
  const frac = (n, d) => `<span class="frac"><span>${n}</span><span>${d}</span></span>`;
  const f = (n, d) => U.fmt(n, d == null ? 2 : d);

  /** Tính toán dùng chung cho các widget nhóm */
  function stats(groups) {
    const gs = groups.map((g) => ({ a: +g.a, b: +g.b, m: +g.m || 0, label: g.label }));
    const n = gs.reduce((t, g) => t + g.m, 0);
    let cum = 0;
    gs.forEach((g) => { g.x = (g.a + g.b) / 2; g.mx = g.m * g.x; g.cumBefore = cum; cum += g.m; g.cum = cum; });
    const sum = gs.reduce((t, g) => t + g.mx, 0);
    const mean = n ? sum / n : NaN;
    const half = n / 2;
    let p = gs.findIndex((g) => g.cum >= half && g.m > 0);
    if (p < 0) p = gs.length - 1;
    const gp = gs[p] || { a: 0, b: 0, m: 1, cumBefore: 0 };
    const median = gp.a + ((half - gp.cumBefore) / (gp.m || 1)) * (gp.b - gp.a);
    return { gs, n, sum, mean, half, p, median };
  }
  W.stats = stats;

  /* ================================================================ groupline */
  W.register('groupline', {
    label: 'Ghép nhóm trên trục số',
    steps: (d) => Math.max(0, ...Object.values(d.at || {}).filter((v) => v != null).map(Number)),
    defaults: () => ({ values: [{ v: 1, c: 2 }, { v: 3, c: 1 }, { v: 6, c: 3 }], domain: [0, 10], edges: [0, 5, 10], ticks: [0, 2, 4, 6, 8, 10], at: { dots: 0, range: null, edges: 1, drop: 2 } }),
    editor: 'json',
    mount(host, d, ctx) {
      const w = ctx.w, hh = ctx.h;
      const [lo, hi] = d.domain || [0, 10];
      const at = Object.assign({ dots: 0, range: null, edges: 1, drop: 2 }, d.at || {});
      const pad = 60, x = (v) => pad + ((v - lo) / (hi - lo)) * (w - 2 * pad);
      const lineY = d.lineY || hh * 0.36;
      const r = d.r || 9, gap = 2 * r + 4;
      const edges = (d.edges || []).map(Number);
      const k = Math.max(0, edges.length - 1);
      const vals = [];
      (d.values || []).forEach((o) => { for (let i = 0; i < (+o.c || 1); i++) vals.push(+o.v); });
      vals.sort((a, b) => a - b);
      const gOf = (v) => { for (let i = 0; i < k; i++) if (v >= edges[i] && (v < edges[i + 1] || (i === k - 1 && v <= edges[i + 1]))) return i; return -1; };
      const svg = s('svg', { viewBox: `0 0 ${w} ${hh}`, class: 'gl' });

      // Dải màu nhóm (hiện ở bước edges)
      const binTop = d.binTop || hh * 0.55, binBot = hh - (d.binLabelSpace || 70);
      const bands = s('g', { class: 'ws', 'data-s': at.edges });
      for (let i = 0; i < k; i++) {
        const x0 = x(edges[i]), x1 = x(edges[i + 1]);
        const col = W.CAT[i % W.CAT.length];
        bands.append(s('rect', { x: x0 + 1, y: lineY - hh * 0.26, width: x1 - x0 - 2, height: hh * 0.26 + 6, fill: col, class: 'gl-band' }));
        bands.append(s('rect', { x: x0 + 4, y: binTop, width: x1 - x0 - 8, height: binBot - binTop, fill: col, class: 'gl-bin', rx: 8 }));
      }
      svg.append(bands);

      // Trục số + vạch
      svg.append(s('line', { x1: pad - 30, x2: w - pad + 30, y1: lineY, y2: lineY, class: 'gl-axis' }));
      (d.ticks || []).forEach((t) => {
