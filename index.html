        svg.append(s('line', { x1: x(t), x2: x(t), y1: lineY - 7, y2: lineY + 7, class: 'gl-tick' }));
        svg.append(s('text', { x: x(t), y: lineY + 36, class: 'gl-tl', 'text-anchor': 'middle' }, U.fmt(t)));
      });

      // Đầu mút nhóm
      const eg = s('g', { class: 'ws', 'data-s': at.edges });
      const skip = d.edgeSkip || [];
      edges.forEach((e, i) => {
        eg.append(s('line', { x1: x(e), x2: x(e), y1: lineY - hh * 0.27, y2: binBot, class: 'gl-edge' }));
        if (!skip.includes(i)) eg.append(s('text', { x: x(e), y: lineY + (d.ticks && d.ticks.length ? 70 : 40), class: 'gl-el', 'text-anchor': 'middle' }, U.fmt(e)));
      });
      svg.append(eg);

      // Chấm dữ liệu: vị trí trên trục → vị trí trong nhóm
      const stackCount = {}, inGroup = {}, counts = new Array(k).fill(0);
      vals.forEach((v) => { const gi = gOf(v); if (gi >= 0) counts[gi]++; });
      const cols = edges.slice(0, -1).map((e, i) => Math.max(1, Math.floor((x(edges[i + 1]) - x(e) - 16) / gap)));
      let maxStack = 0;
      const dg = s('g', { class: 'ws', 'data-s': at.dots });
      vals.forEach((v, idx) => {
        const kk = (stackCount[v] = (stackCount[v] || 0) + 1) - 1;
        maxStack = Math.max(maxStack, kk + 1);
        const cx = x(v), cy = lineY - r - 6 - kk * gap;
        const gi = gOf(v);
        let tx = 0, ty = 0;
        if (gi >= 0) {
          const j = (inGroup[gi] = (inGroup[gi] || 0) + 1) - 1;
          const c = cols[gi], col = j % c, row = Math.floor(j / c);
          const x0 = x(edges[gi]), bw = x(edges[gi + 1]) - x0;
          const used = Math.min(c, counts[gi]) * gap;
          const px = x0 + (bw - used) / 2 + gap / 2 + col * gap;
          const py = binBot - r - 8 - row * gap;
          tx = px - cx; ty = py - cy;
        }
        dg.append(s('circle', {
          cx, cy, r, class: 'gl-dot',
          style: `--gc:${gi >= 0 ? W.CAT[gi % W.CAT.length] : '#888'};--to:translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px);transition-delay:${(idx * 22) % 700}ms`,
        }));
      });
      svg.append(dg);

      // Khoảng biến thiên
      if (at.range != null && vals.length) {
        const yb = lineY - r - 6 - maxStack * gap - 22;
        const a = x(vals[0]), b = x(vals[vals.length - 1]);
        svg.append(s('g', { class: 'ws', 'data-s': at.range },
          s('path', { d: `M${a} ${yb + 12} V${yb} H${b} V${yb + 12}`, class: 'gl-range' }),
          s('text', { x: (a + b) / 2, y: yb - 14, class: 'gl-rt', 'text-anchor': 'middle' }, d.rangeText || ('R = ' + U.fmt(vals[vals.length - 1]) + ' − ' + U.fmt(vals[0]) + ' = ' + U.fmt(vals[vals.length - 1] - vals[0])))));
      }

      // Nhãn nhóm & tần số trong mỗi nhóm
      const lg = s('g', { class: 'ws', 'data-s': at.drop });
      for (let i = 0; i < k; i++) {
        const cxm = (x(edges[i]) + x(edges[i + 1])) / 2;
        const rows = Math.ceil(counts[i] / cols[i]) || 0;
        lg.append(s('text', { x: cxm, y: binBot - rows * gap - 22, class: 'gl-count', 'text-anchor': 'middle' }, String(counts[i])));
      }
      svg.append(lg);
      const nl = s('g', { class: 'ws', 'data-s': at.edges });
      for (let i = 0; i < k; i++) {
        const cxm = (x(edges[i]) + x(edges[i + 1])) / 2;
        const label = (d.labels && d.labels[i]) || ('[' + U.fmt(edges[i]) + '; ' + U.fmt(edges[i + 1]) + (i === k - 1 && d.closedLast ? ']' : ')'));
        nl.append(s('text', { x: cxm, y: binBot + 40, class: 'gl-gl', 'text-anchor': 'middle' }, label));
      }
      svg.append(nl);

      host.append(svg);
      const base = W.stepper(svg);
      return {
        setStep(st, animate) {
          base(st, animate);
          svg.classList.toggle('s-edges', st >= at.edges);
          svg.classList.toggle('s-drop', st >= at.drop);
        },
        activate() {}, deactivate() {}, destroy() { svg.remove(); },
      };
    },
  });

  /* ================================================================ meancalc */
  W.register('meancalc', {
    label: 'Tính số trung bình (từng bước)',
    steps: (d) => (+d.stepStart || 0) + 4,
    defaults: () => ({ groups: [{ a: 0, b: 10, m: 3 }, { a: 10, b: 20, m: 5 }, { a: 20, b: 30, m: 2 }], label: 'Nhóm', unit: '', decimals: 2, stepStart: 0 }),
    editor: 'groups',
    mount(host, d, ctx) {
      const st0 = +d.stepStart || 0, dec = d.decimals == null ? 2 : +d.decimals;
      const S = stats(d.groups || []), gs = S.gs;
      const w = ctx.w, hh = ctx.h;
      const root = h('div', { class: 'mc' });

      // --- Bảng
      const tb = h('table', { class: 'dtable mc-table' });
      tb.append(h('thead', {}, h('tr', {},
        h('th', { html: d.label || 'Nhóm' }), h('th', { html: 'Giá trị đại diện ' + sub('x', 'i') }),
        h('th', { html: 'Tần số ' + sub('m', 'i') }), h('th', { html: sub('m', 'i') + sub('x', 'i') }))));
      const body = h('tbody');
      gs.forEach((g, i) => {
        body.append(h('tr', {},
          h('td', { class: 'g' }, U.groupLabel(g, i === gs.length - 1 && d.closedLast)),
          h('td', { class: 'ws num acc', 'data-s': st0 + 1, style: { transitionDelay: i * 60 + 'ms' } }, f(g.x, 4)),
          h('td', { class: 'num' }, f(g.m)),
          h('td', { class: 'ws num acc2', 'data-s': st0 + 2, style: { transitionDelay: i * 110 + 'ms' } }, f(g.m, 0) + ' · ' + f(g.x, 4) + ' = ' + f(g.mx, 4))));
      });
      body.append(h('tr', { class: 'total ws', 'data-s': st0 + 3 },
        h('td', {}, 'Tổng'), h('td', {}, ''), h('td', { class: 'num', html: 'n = ' + f(S.n) }), h('td', { class: 'num' }, f(S.sum, 4))));
      tb.append(body);
      const legend = h('div', { class: 'mc-steps' },
        [['Giá trị đại diện ' + sub('x', 'i') + ' = trung điểm nhóm', 1], ['Nhân: ' + sub('m', 'i') + sub('x', 'i'), 2], ['Cộng: n và tổng các ' + sub('m', 'i') + sub('x', 'i'), 3], ['Chia tổng cho n', 4]]
          .map(([t, k]) => h('div', { class: 'mc-st', 'data-k': st0 + k }, h('span', {}, String(k)), h('em', { html: t }))));
      const left = h('div', { class: 'mc-left' }, tb, legend);

      // --- Cán cân: khối mᵢ đặt tại xᵢ; điểm tựa cân bằng tại x̄
      const BW = Math.round(w * 0.44), BH = Math.round(hh * 0.5);
      const lo = gs.length ? gs[0].a : 0, hi = gs.length ? gs[gs.length - 1].b : 1;
      const padB = 46, bx = (v) => padB + ((v - lo) / (hi - lo || 1)) * (BW - 2 * padB);
      const beamY = BH * 0.66, maxM = Math.max(1, ...gs.map((g) => g.m));
      const svg = s('svg', { viewBox: `0 0 ${BW} ${BH}`, class: 'mc-beam' });
      const beam = s('g', { class: 'mc-beamg' });
      beam.append(s('line', { x1: padB - 20, x2: BW - padB + 20, y1: beamY, y2: beamY, class: 'mc-bar' }));
      gs.forEach((g, i) => {
        beam.append(s('line', { x1: bx(g.a), x2: bx(g.a), y1: beamY - 6, y2: beamY + 6, class: 'mc-tick' }));
        if (i === gs.length - 1) beam.append(s('line', { x1: bx(g.b), x2: bx(g.b), y1: beamY - 6, y2: beamY + 6, class: 'mc-tick' }));
        const bh = (g.m / maxM) * BH * 0.42, ww = Math.min(34, (bx(g.b) - bx(g.a)) * 0.5);
        beam.append(s('g', { class: 'ws mc-w', 'data-s': st0 + 1, style: `transition-delay:${i * 70}ms` },
          s('rect', { x: bx(g.x) - ww / 2, y: beamY - 3 - bh, width: ww, height: bh, rx: 4, class: 'mc-wt' }),
          s('text', { x: bx(g.x), y: beamY - bh - 14, class: 'mc-wl', 'text-anchor': 'middle' }, f(g.m))));
      });
      [lo, hi].concat(gs.slice(1).map((g) => g.a)).forEach((v) => {
        beam.append(s('text', { x: bx(v), y: beamY + 56, class: 'mc-al', 'text-anchor': 'middle' }, f(v)));
      });
      svg.append(beam);
      const mid = (lo + hi) / 2;
      const ful = s('g', { class: 'mc-ful' },
        s('polygon', { points: `0,${beamY + 4} -15,${beamY + 30} 15,${beamY + 30}`, class: 'mc-tri' }),
        s('g', { class: 'ws', 'data-s': st0 + 4 },
          s('text', { x: 0, y: beamY + 98, class: 'mc-fl', 'text-anchor': 'middle' }, s('tspan', { 'text-decoration': 'overline', style: 'font-style:italic' }, 'x'), ' ≈ ' + f(S.mean, dec))));
      svg.append(ful);
      const tau = gs.reduce((t, g) => t + g.m * (g.x - mid), 0);
      const tilt = U.clamp((tau / (Math.max(1, S.n) * (hi - lo || 1))) * 60, -7, 7);
      const cap = h('div', { class: 'mc-cap' }, 'Đặt "khối" ', h('i', { html: sub('m', 'i') }), ' tại ', h('i', { html: sub('x', 'i') }), ': điểm làm cán cân thăng bằng chính là ', h('b', { html: '<span class="bar">x</span>' }), '.');

      // --- Công thức
      const terms = gs.map((g) => f(g.m) + '·' + f(g.x, 4)).join(' + ');
      const fo = h('div', { class: 'mc-formula' },
        h('div', { class: 'ws fl', 'data-s': st0 + 3, html: 'n = ' + gs.map((g) => f(g.m)).join(' + ') + ' = <b>' + f(S.n) + '</b>' }),
        h('div', { class: 'ws fl big', 'data-s': st0 + 3, html: '<span class="bar">x</span> = ' + frac(terms, f(S.n)) }),
        h('div', { class: 'ws fl big res', 'data-s': st0 + 4, html: '= ' + frac(f(S.sum, 4), f(S.n)) + (U.isRounded(S.mean, dec) ? ' ≈ ' : ' = ') + '<b>' + f(S.mean, dec) + '</b>' + (d.unit ? ' (' + d.unit + ')' : '') }));
      const right = h('div', { class: 'mc-right' }, svg, cap, fo);
      root.append(left, right);
      host.append(root);
      const fit = () => fo.querySelectorAll('.fl').forEach((nd) => U.fitText(nd, 18));
      requestAnimationFrame(fit);

      const base = W.stepper(root);
      const place = (st) => {
        const fin = st >= st0 + 4, showW = st >= st0 + 1;
        const fx = fin ? bx(S.mean) : bx(mid);
        ful.style.transform = `translate(${fx}px,0)`;
        beam.style.transformOrigin = `${fx}px ${beamY}px`;
        beam.style.transform = `rotate(${fin || !showW ? 0 : tilt}deg)`;
      };
      return {
        setStep(st, animate) { base(st, animate); legend.querySelectorAll('.mc-st').forEach((n) => { n.classList.toggle('done', st > +n.dataset.k || (st >= st0 + 4 && +n.dataset.k <= st)); n.classList.toggle('cur', st === +n.dataset.k && st < st0 + 4); }); if (!animate) root.classList.add('instant'); place(st); if (!animate) setTimeout(() => root.classList.remove('instant'), 40); },
        activate() { fit(); }, deactivate() {}, destroy() { root.remove(); },
      };
    },
  });

  /* ================================================================ cumlocate */
  W.register('cumlocate', {
    label: 'Xác định nhóm chứa trung vị',
    steps: (d) => (+d.stepStart || 0) + 2,
    defaults: () => ({ groups: [{ a: 0, b: 5, m: 3 }, { a: 5, b: 10, m: 8 }, { a: 10, b: 15, m: 7 }], stepStart: 0 }),
    editor: 'groups',
    mount(host, d, ctx) {
      const st0 = +d.stepStart || 0;
      const S = stats(d.groups || []), gs = S.gs, n = S.n;
      const w = ctx.w, hh = ctx.h;
      const svg = s('svg', { viewBox: `0 0 ${w} ${hh}`, class: 'cl' });
      const pad = 40, cw = Math.min(78, (w - 2 * pad) / Math.max(1, n)), sx = (w - cw * n) / 2, sy = 54, ch = 64;
      const cellG = s('g');
      const gi = []; gs.forEach((g, i) => { for (let j = 0; j < g.m; j++) gi.push(i); });
      gi.forEach((g, j) => {
        cellG.append(s('rect', { x: sx + j * cw + 2, y: sy, width: cw - 4, height: ch, rx: 6, fill: W.CAT[g % W.CAT.length], class: 'cl-cell', 'data-j': j + 1 }));
        if (cw >= 40) cellG.append(W.stext({ x: sx + j * cw + cw / 2, y: sy + ch / 2 + 9, class: 'cl-cl', 'text-anchor': 'middle' }, ['x', { sub: String(j + 1) }]));
      });
      svg.append(cellG);
      // ngoặc nhóm
      let acc = 0;
      gs.forEach((g, i) => {
        const x0 = sx + acc * cw, x1 = sx + (acc + g.m) * cw; acc += g.m;
        if (!g.m) return;
        svg.append(s('path', { d: `M${x0 + 4} ${sy + ch + 14} v10 H${x1 - 4} v-10`, class: 'cl-br', stroke: W.CAT[i % W.CAT.length] }));
        svg.append(s('text', { x: (x0 + x1) / 2, y: sy + ch + 56, class: 'cl-gl', 'text-anchor': 'middle' }, U.groupLabel(g, i === gs.length - 1 && d.closedLast)));
      });
      // bước 1: vị trí trung vị trong dãy đã sắp xếp
      const midIdx = n % 2 ? [(n + 1) / 2] : [n / 2, n / 2 + 1];
      const mg = s('g', { class: 'ws', 'data-s': st0 + 1 });
      midIdx.forEach((j) => mg.append(s('rect', { x: sx + (j - 1) * cw - 1, y: sy - 5, width: cw + 2, height: ch + 10, rx: 9, class: 'cl-mid' })));
      const mtext = n % 2 ? ['Trung vị là ', 'x', { sub: String(midIdx[0]) }, '\u00a0\u00a0(n = ' + n + ' lẻ)'] : ['Trung vị là (', 'x', { sub: String(midIdx[0]) }, ' + ', 'x', { sub: String(midIdx[1]) }, ') : 2'];
      const mx = sx + ((midIdx[0] + (midIdx[1] || midIdx[0])) / 2 - 0.5) * cw;
      mg.append(W.stext({ x: U.clamp(mx, 260, w - 260), y: sy - 18, class: 'cl-mt', 'text-anchor': 'middle' }, mtext));
      svg.append(mg);

      // bước 2: biểu đồ tần số tích luỹ (cộng dồn) tăng dần
      const ct = sy + ch + 110, cb = hh - 64, chh = cb - ct;
      const k = gs.length, slot = Math.min(260, (w - 380) / Math.max(1, k)), cx0 = 300;
      const cg = s('g', { class: 'ws', 'data-s': st0 + 2 });
      cg.append(s('text', { x: 20, y: ct + 26, class: 'cl-ttl' }, 'Cộng dồn tần số'));
      cg.append(s('line', { x1: cx0 - 20, x2: cx0 + k * slot + 20, y1: cb, y2: cb, class: 'cl-axis' }));
      gs.forEach((g, i) => {
        const bh = (g.cum / Math.max(1, n)) * (chh - 40);
        const x0 = cx0 + i * slot + slot * 0.14, bw = slot * 0.72;
        cg.append(s('g', { class: 'cl-bar' + (i === S.p ? ' hl' : ''), style: `--i:${i}` },
          s('rect', { x: x0, y: cb - bh, width: bw, height: bh, rx: 5 }),
          s('text', { x: x0 + bw / 2, y: cb - bh - 12, 'text-anchor': 'middle', class: 'cl-v' }, f(g.cum)),
          s('text', { x: x0 + bw / 2, y: cb + 36, 'text-anchor': 'middle', class: 'cl-x' }, U.groupLabel(g, i === gs.length - 1 && d.closedLast))));
      });
      const yh = cb - (S.half / Math.max(1, n)) * (chh - 40);
      cg.append(s('line', { x1: cx0 - 20, x2: cx0 + k * slot + 20, y1: yh, y2: yh, class: 'cl-half' }));
      cg.append(s('text', { x: cx0 + k * slot + 30, y: yh + 8, class: 'cl-ht' }, 'n/2 = ' + f(S.half)));
      const gp = gs[S.p];
      if (gp) {
        cg.append(s('text', { x: 20, y: ct + 76, class: 'cl-note' }, 'Nhóm đầu tiên có'));
        cg.append(s('text', { x: 20, y: ct + 110, class: 'cl-note' }, 'tổng cộng dồn ≥ n/2:'));
        cg.append(s('text', { x: 20, y: ct + 156, class: 'cl-ans' }, U.groupLabel(gp, S.p === gs.length - 1 && d.closedLast)));
      }
      svg.append(cg);
      host.append(svg);
      const base = W.stepper(svg);
      return { setStep: base, activate() {}, deactivate() {}, destroy() { svg.remove(); } };
    },
  });

  /* ================================================================ mediancalc */
  W.register('mediancalc', {
    label: 'Tính trung vị (từng bước)',
    steps: (d) => (+d.stepStart || 0) + 4,
    defaults: () => ({ groups: [{ a: 0, b: 10, m: 3 }, { a: 10, b: 20, m: 6 }, { a: 20, b: 30, m: 5 }], label: 'Nhóm', unit: '', decimals: 2, stepStart: 0 }),
    editor: 'groups',
    mount(host, d, ctx) {
      const st0 = +d.stepStart || 0, dec = d.decimals == null ? 2 : +d.decimals;
      const S = stats(d.groups || []), gs = S.gs, n = S.n, p = S.p, gp = gs[p];
      const w = ctx.w, hh = ctx.h;
      const root = h('div', { class: 'md' });
      const last = (i) => i === gs.length - 1 && d.closedLast;

      // Bảng ngang
      const tb = h('table', { class: 'dtable md-table' });
      const r1 = h('tr', {}, h('th', { html: d.label || 'Nhóm' })), r2 = h('tr', {}, h('th', {}, d.freqLabel || 'Tần số'));
      gs.forEach((g, i) => { r1.append(h('td', { class: 'g' + (i === p ? ' pcol' : ''), 'data-i': i }, U.groupLabel(g, last(i)))); r2.append(h('td', { class: 'num' + (i === p ? ' pcol' : ''), 'data-i': i }, f(g.m))); });
      tb.append(h('tbody', {}, r1, r2));
      root.append(tb);

      // Dải vị trí x₁…xₙ (tỉ lệ theo tần số)
      const SH = Math.round(hh * 0.34), SW = w;
      const svg = s('svg', { viewBox: `0 0 ${SW} ${SH}`, class: 'md-strip' });
      const x0 = 40, sw = SW - 80, py = SH * 0.36, ph = SH * 0.26;
      const xp = (pos) => x0 + (pos / Math.max(1, n)) * sw;
      gs.forEach((g, i) => {
        const a = xp(g.cumBefore), b = xp(g.cum);
        svg.append(s('g', { class: 'md-seg' + (i === p ? ' p' : ''), 'data-i': i },
          s('rect', { x: a + 1, y: py, width: Math.max(0, b - a - 2), height: ph, rx: 6, fill: W.CAT[i % W.CAT.length] }),
          b - a > 34 ? s('text', { x: (a + b) / 2, y: py + ph / 2 + 9, 'text-anchor': 'middle', class: 'md-m' }, f(g.m)) : null));
      });
      if (n <= 90) {
        const cells = s('g', { class: 'md-cells' });
        for (let j = 1; j < n; j++) cells.append(s('line', { x1: xp(j), x2: xp(j), y1: py + 4, y2: py + ph - 4 }));
        svg.append(cells);
      }
      const cumG = s('g', { class: 'ws', 'data-s': st0 + 2 });
      [0].concat(gs.map((g) => g.cum)).forEach((c, i) => {
        cumG.append(s('line', { x1: xp(c), x2: xp(c), y1: py + ph, y2: py + ph + 14, class: 'md-ctick' }));
        cumG.append(s('text', { x: xp(c), y: py + ph + 42, 'text-anchor': 'middle', class: 'md-cv' + (i === p || i === p + 1 ? ' hl' : '') }, f(c)));
      });
      cumG.append(s('text', { x: x0, y: SH - 8, class: 'md-cap' }, 'Số thứ tự cộng dồn ở cuối mỗi nhóm'));
      svg.append(cumG);
      const hx = xp(S.half);
      const midTxt = n % 2 ? ['n = ' + n + ' (lẻ) ⇒ trung vị là ', 'x', { sub: String((n + 1) / 2) }] : ['n = ' + n + ' ⇒ trung vị là (', 'x', { sub: String(n / 2) }, ' + ', 'x', { sub: String(n / 2 + 1) }, ') : 2'];
      svg.append(s('g', { class: 'ws', 'data-s': st0 + 1 },
        s('line', { x1: hx, x2: hx, y1: py - 34, y2: py + ph + 6, class: 'md-half' }),
        s('polygon', { points: `${hx},${py - 4} ${hx - 9},${py - 20} ${hx + 9},${py - 20}`, class: 'md-halfa' }),
        W.stext({ x: U.clamp(hx, 340, SW - 340), y: py - 44, 'text-anchor': 'middle', class: 'md-ht' }, midTxt.concat(['\u00a0\u00a0·\u00a0\u00a0n/2 = ' + f(S.half)]))));
      root.append(svg);

      // Công thức + phóng to nhóm p
      const sumPrev = p === 0 ? '0' : gs.slice(0, p).map((g, i) => sub('m', i + 1)).join(' + ');
      const sumPrevVal = p === 0 ? '0' : gs.slice(0, p).map((g) => f(g.m)).join(' + ') + (p > 1 ? ' = ' + f(gp.cumBefore) : '');
      const fo = h('div', { class: 'md-formula' },
        h('div', { class: 'ws fl', 'data-s': st0 + 2, html: `Nhóm chứa trung vị: <b>p = ${p + 1}</b>, nhóm <b>${U.groupLabel(gp, last(p))}</b> <span class="muted">(vì ${f(gp.cumBefore)} &lt; ${f(S.half)} ≤ ${f(gp.cum)})</span>` }),
        h('div', { class: 'ws fl', 'data-s': st0 + 3, html: `${sub('a', p + 1)} = ${f(gp.a)}; &nbsp;${sub('m', p + 1)} = ${f(gp.m)}; &nbsp;${p === 0 ? 'p = 1 nên quy ước tổng = 0' : sumPrev + ' = ' + sumPrevVal}; &nbsp;${sub('a', p + 2)} − ${sub('a', p + 1)} = ${f(gp.b - gp.a)}` }),
        h('div', { class: 'ws fl big res', 'data-s': st0 + 4, html: `${sub('M', 'e')} = ${f(gp.a)} + ${frac(frac(f(n), '2') + ' − ' + f(gp.cumBefore), f(gp.m))} · ${f(gp.b - gp.a)} ${U.isRounded(S.median, dec) ? '≈' : '='} <b>${f(S.median, dec)}</b>${d.unit ? ' (' + d.unit + ')' : ''}` }));
      const ZW = Math.round(w * 0.42), ZH = Math.round(hh * 0.34);
      const z = s('svg', { viewBox: `0 0 ${ZW} ${ZH}`, class: 'md-zoom ws', 'data-s': st0 + 4 });
      const zx0 = 40, zw = ZW - 80, zy = ZH * 0.30, zh = 40;
      const take = S.half - gp.cumBefore;
      const m = Math.max(1, gp.m);
      z.append(s('text', { x: zx0, y: 26, class: 'md-zt' }, 'Giả sử các giá trị trải đều trong nhóm ' + U.groupLabel(gp, last(p))));
      z.append(s('rect', { x: zx0, y: zy, width: zw, height: zh, rx: 6, class: 'md-zbg' }));
      z.append(s('rect', { x: zx0, y: zy, width: (take / m) * zw, height: zh, rx: 6, class: 'md-zfill' }));
      if (m <= 60) for (let j = 1; j < m; j++) z.append(s('line', { x1: zx0 + (j / m) * zw, x2: zx0 + (j / m) * zw, y1: zy + 6, y2: zy + zh - 6, class: 'md-zc' }));
      const mxz = zx0 + (take / m) * zw, ay = zy + zh + 64;
      z.append(s('text', { x: zx0 + ((take / m) * zw) / 2, y: zy + zh / 2 + 8, 'text-anchor': 'middle', class: 'md-zl' }, f(take) + ' / ' + f(gp.m)));
      z.append(s('line', { x1: zx0, x2: zx0 + zw, y1: ay, y2: ay, class: 'md-zaxis' }));
      z.append(s('line', { x1: mxz, x2: mxz, y1: zy + zh + 4, y2: ay + 10, class: 'md-zm' }));
      z.append(s('text', { x: zx0, y: ay + 36, 'text-anchor': 'middle', class: 'md-za' }, f(gp.a)));
      z.append(s('text', { x: zx0 + zw, y: ay + 36, 'text-anchor': 'middle', class: 'md-za' }, f(gp.b)));
      z.append(s('line', { x1: mxz, x2: mxz, y1: ay + 10, y2: ay + 50, class: 'md-zm thin' }));
      z.append(W.stext({ x: U.clamp(mxz, zx0 + 90, zx0 + zw - 90), y: ay + 80, 'text-anchor': 'middle', class: 'md-zme' }, ['M', { sub: 'e' }, '\u00a0' + (U.isRounded(S.median, dec) ? '≈ ' : '= ') + f(S.median, dec)]));
      root.append(h('div', { class: 'md-bottom' }, fo, h('div', { class: 'md-zwrap' }, z)));
      host.append(root);
      const fit = () => fo.querySelectorAll('.fl').forEach((nd) => U.fitText(nd, 18));
      requestAnimationFrame(fit);

      const base = W.stepper(root);
      return {
        setStep(st, animate) {
          base(st, animate);
          const on = st >= st0 + 2;
          root.classList.toggle('show-p', on);
        },
        activate() { fit(); }, deactivate() {}, destroy() { root.remove(); },
      };
    },
  });
})();

</script>
<script data-app-module="widgets-quiz">
/* ==========================================================================
   widgets-quiz.js — Quiz trắc nghiệm tương tác (củng cố).
   - Một câu mỗi lần, chữ lớn đọc rõ từ cuối lớp.
   - Bấm đáp án → đúng/sai + giải thích. Phím 1–4 để chọn khi slide đang mở.
   - Dữ liệu câu hỏi nằm trong deck (sửa được trong Editor).
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h, W = App.widgets;
  const L = ['A', 'B', 'C', 'D', 'E', 'F'];

  W.register('quiz', {
    label: 'Quiz trắc nghiệm',
    steps: () => 0,
    defaults: () => ({ questions: [{ q: 'Câu hỏi mới?', options: ['Đáp án 1', 'Đáp án 2', 'Đáp án 3', 'Đáp án 4'], answer: 0, explain: '' }] }),
    editor: 'quiz',
    mount(host, d, ctx) {
      const qs = d.questions || [];
      const state = qs.map(() => ({ picked: null }));
      let cur = 0;
      const root = h('div', { class: 'quiz' });
      const pills = h('div', { class: 'qz-pills' });
      const card = h('div', { class: 'qz-card' });
      const score = h('div', { class: 'qz-score' });
      root.append(h('div', { class: 'qz-side' }, h('div', { class: 'qz-side-ttl' }, 'Câu hỏi'), pills, score,
        h('button', { class: 'btn ghost qz-reset', onclick: () => { state.forEach((s) => (s.picked = null)); cur = 0; render(); } }, '↺ Làm lại')), card);
      host.append(root);

      function render() {
        pills.innerHTML = '';
        qs.forEach((q, i) => {
          const st = state[i];
          const cls = 'qz-pill' + (i === cur ? ' cur' : '') + (st.picked == null ? '' : st.picked === +q.answer ? ' ok' : ' bad');
          pills.append(h('button', { class: cls, onclick: () => { cur = i; render(); } }, String(i + 1)));
        });
        const done = state.filter((s) => s.picked != null).length;
        const right = state.filter((s, i) => s.picked != null && s.picked === +qs[i].answer).length;
        score.innerHTML = `Đúng <b>${right}</b> / ${qs.length}` + (done === qs.length && qs.length ? '<br><span class="qz-done">Hoàn thành!</span>' : '');
        card.innerHTML = '';
        const q = qs[cur];
        if (!q) { card.append(h('div', { class: 'qz-q' }, 'Chưa có câu hỏi.')); return; }
        const st = state[cur];
        card.append(h('div', { class: 'qz-num' }, `Câu ${cur + 1} / ${qs.length}`));
        card.append(h('div', { class: 'qz-q', html: q.q }));
        const opts = h('div', { class: 'qz-opts' });
        (q.options || []).forEach((o, i) => {
          let cls = 'qz-opt';
          if (st.picked != null) { if (i === +q.answer) cls += ' ok'; else if (i === st.picked) cls += ' bad'; else cls += ' fade'; }
          opts.append(h('button', { class: cls, disabled: st.picked != null, onclick: () => pick(i) },
            h('span', { class: 'qz-l' }, L[i]), h('span', { class: 'qz-t', html: o })));
        });
        card.append(opts);
        if (st.picked != null) {
          const ok = st.picked === +q.answer;
          card.append(h('div', { class: 'qz-exp ' + (ok ? 'ok' : 'bad') },
            h('b', {}, ok ? '✓ Chính xác. ' : '✕ Chưa đúng — đáp án ' + L[+q.answer] + '. '), h('span', { html: q.explain || '' })));
        }
        card.append(h('div', { class: 'qz-nav' },
          h('button', { class: 'btn ghost', disabled: cur === 0, onclick: () => { cur--; render(); } }, '← Câu trước'),
          h('button', { class: 'btn', disabled: cur >= qs.length - 1, onclick: () => { cur++; render(); } }, 'Câu tiếp →')));
      }
      function pick(i) { if (state[cur].picked != null) return; state[cur].picked = i; render(); }

      const onKey = (e) => {
        if (App.editor && App.editor.active) return;
        if (/^[1-6]$/.test(e.key)) { const i = +e.key - 1; if (qs[cur] && i < (qs[cur].options || []).length) { pick(i); e.preventDefault(); } }
      };
      render();
      return {
        setStep() {},
        activate() { if (!ctx.static) window.addEventListener('keydown', onKey); },
        deactivate() { window.removeEventListener('keydown', onKey); },
        destroy() { window.removeEventListener('keydown', onKey); root.remove(); },
      };
    },
  });
})();

</script>
<script data-app-module="renderer">
/* ==========================================================================
   renderer.js — Dựng DOM từ dữ liệu deck (tách khỏi editor & animation).
   - Mỗi phần tử định vị tuyệt đối trên sân khấu 1920×1080.
   - Widget mount "lười": chỉ khi slide sắp hiển thị (slide hiện tại + kế tiếp),
     và được giải phóng khi slide ở xa (> 2 slide) để tránh rò bộ nhớ.
   - Sửa nội dung chỉ dựng lại MỘT slide; renderer WebGL không bị động tới.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h;

  const R = {
    stage: null,
    nodes: [],      // DOM .slide theo index
    inst: [],       // Map(elId → widget instance) theo index
    init(stage) { this.stage = stage; },
    get deck() { return App.store.deck; },

    renderAll() {
      this.inst.forEach((m) => m && m.forEach((w) => w && w.destroy && w.destroy()));
      this.stage.innerHTML = '';
      this.nodes = []; this.inst = [];
      this.deck.slides.forEach((sl, i) => {
        const n = this.buildSlide(sl, i, {});
        this.nodes.push(n); this.inst.push(null);
        this.stage.append(n);
      });
    },

    /** Dựng lại 1 slide (sau khi sửa); giữ trạng thái hiển thị */
    replaceSlide(i) {
      const old = this.nodes[i];
      this.release(i);
      const n = this.buildSlide(this.deck.slides[i], i, {});
      if (old) { n.className = old.className; old.replaceWith(n); } else this.stage.append(n);
      this.nodes[i] = n;
      return n;
    },

    buildSlide(sl, i, opts) {
      const n = h('div', { class: 'slide', 'data-i': i, 'data-section': sl.section || 'A', 'data-id': sl.id });
      if (sl.veil) n.append(h('div', { class: 'slide-veil', style: { opacity: sl.veil } }));
      if (sl.bgImage) n.append(h('div', { class: 'slide-bgimg', style: { backgroundImage: `url("${sl.bgImage}")` } }));
      const els = (sl.elements || []).slice().sort((a, b) => (a.z || 0) - (b.z || 0));
      els.forEach((el) => n.append(this.buildEl(el, sl, opts)));
      return n;
    },

    buildEl(el, sl, opts) {
      const st = el.style || {};
      const node = h('div', {
        class: 'el el-' + el.type + (el.depth ? ' has-depth' : ''),
        'data-id': el.id, 'data-step': el.step || 0, 'data-anim': el.anim || 'up',
        style: {
          left: el.x + 'px', top: el.y + 'px', width: el.w + 'px', height: el.h + 'px',
          zIndex: 10 + (el.z || 0), opacity: st.opacity != null ? st.opacity : '',
        },
      });
      if (el.depth) node.style.setProperty('--d', el.depth);
      let content;
      switch (el.type) {
        case 'text':
          content = h('div', { class: 'content ' + (el.cls || '') });
          // Công thức: bọc 1 lớp để flex căn giữa mà không tách chữ/ký hiệu
          if (/\bformula\b/.test(el.cls || '')) content.append(h('div', { class: 'fx', html: el.html || '' }));
          else content.innerHTML = el.html || '';
          break;
        case 'image':
          content = h('div', { class: 'content ' + (el.cls || '') }, h('img', { src: el.src || '', alt: el.alt || '', draggable: 'false', style: { objectFit: el.fit || 'contain' } }));
          break;
        case 'shape':
          content = h('div', { class: 'content shape shape-' + (el.shape || 'rect') + ' ' + (el.cls || '') });
          break;
        case 'svg':
          content = h('div', { class: 'content ' + (el.cls || ''), html: el.svg || '' });
          break;
        case 'table':
          content = h('div', { class: 'content ' + (el.cls || '') + (el.tight ? ' tight' : '') }, this.buildTable(el));
          break;
        case 'widget':
          content = h('div', { class: 'content w-host ' + (el.cls || ''), 'data-widget': el.widget });
          if (opts.static) {
            const w = App.widgets.mount(el.widget, content, el.data, { w: el.w, h: el.h, static: true, section: sl.section });
            if (w) w.setStep(Infinity, false);
          }
          break;
        default:
          content = h('div', { class: 'content' });
      }
      ['fontSize', 'color', 'textAlign', 'fontWeight', 'fontStyle', 'background', 'borderRadius', 'lineHeight', 'padding', 'border'].forEach((k) => {
        if (st[k] != null && st[k] !== '') content.style[k] = k === 'fontSize' && typeof st[k] === 'number' ? st[k] + 'px' : st[k];
      });
      node.append(content);
      return node;
    },

    buildTable(el) {
      const t = h('table', { class: 'dtable' + (el.compact ? ' compact' : '') });
      const rows = (el.table && el.table.rows) || [];
      const head = el.table && el.table.head, headCol = el.table ? el.table.headCol !== false : true;
      const hl = (el.table && el.table.hlCols) || [];
      rows.forEach((r, ri) => {
        const tr = h('tr');
        r.forEach((c, ci) => {
          const isH = (head && ri === 0) || (headCol && ci === 0);
          tr.append(h(isH ? 'th' : 'td', { html: String(c), class: hl.includes(ci) ? 'hlc' : null, 'data-r': ri, 'data-c': ci }));
        });
        t.append(tr);
      });
      return t;
    },

    /** Mount widget của slide i (nếu chưa) */
    prepare(i) {
      if (i < 0 || i >= this.nodes.length || this.inst[i]) return;
      const sl = this.deck.slides[i], node = this.nodes[i], map = new Map();
      (sl.elements || []).forEach((el) => {
        if (el.type !== 'widget') return;
        const host = node.querySelector(`.el[data-id="${el.id}"] .w-host`);
        if (!host) return;
        map.set(el.id, App.widgets.mount(el.widget, host, el.data, { w: el.w, h: el.h, section: sl.section }));
      });
      this.inst[i] = map;
    },
    release(i) {
      const m = this.inst[i];
      if (!m) return;
      m.forEach((w) => { try { w && w.deactivate && w.deactivate(); w && w.destroy && w.destroy(); } catch (e) { console.error(e); } });
      this.inst[i] = null;
      const node = this.nodes[i];
      if (node) node.querySelectorAll('.w-host').forEach((x) => (x.innerHTML = ''));
    },
    /** Giải phóng widget của các slide ở xa slide hiện tại */
    gc(cur) { this.inst.forEach((m, i) => { if (m && Math.abs(i - cur) > 2) this.release(i); }); },

    totalSteps(i) {
      const sl = this.deck.slides[i];
      if (!sl) return 0;
      let m = 0;
      (sl.elements || []).forEach((el) => {
        m = Math.max(m, +el.step || 0);
        if (el.type === 'widget') m = Math.max(m, App.widgets.steps(el.widget, el.data));
      });
      return m;
    },

    /**
     * Áp dụng bước st cho slide i.
     * mode: 'enter' (hiện tuần tự mọi phần tử), 'step' (chỉ phần tử mới), 'instant'
     */
    applyStep(i, st, mode) {
      const node = this.nodes[i];
      if (!node) return;
      const els = Array.from(node.children).filter((c) => c.classList.contains('el'));
      const reveal = [];
      els.forEach((c) => {
        const vis = st >= (+c.dataset.step || 0);
        if (!vis) { c.classList.add('hid'); c.classList.remove('rv'); return; }
        const wasHidden = c.classList.contains('hid');
        c.classList.remove('hid');
        if (mode === 'instant') { c.classList.remove('rv'); c.style.animationDelay = ''; }
        else if (wasHidden || mode === 'enter') { c.classList.remove('rv'); reveal.push(c); }
      });
      if (reveal.length) {
        reveal.sort((a, b) => (parseFloat(a.style.top) - parseFloat(b.style.top)) || (parseFloat(a.style.left) - parseFloat(b.style.left)));
        void node.offsetWidth; // 1 lần reflow cho cả nhóm (tránh layout thrashing)
        const base = mode === 'enter' ? 140 : 0, gap = mode === 'enter' ? 85 : 70;
        reveal.forEach((c, k) => { c.style.animationDelay = base + k * gap + 'ms'; c.classList.add('rv'); });
      }
      const m = this.inst[i];
      if (m) m.forEach((w) => w && w.setStep && w.setStep(st, mode !== 'instant'));
    },
    activate(i) { const m = this.inst[i]; if (m) m.forEach((w) => w && w.activate && w.activate()); },
    deactivate(i) { const m = this.inst[i]; if (m) m.forEach((w) => w && w.deactivate && w.deactivate()); },

    /** Ảnh thu nhỏ tĩnh của slide (dùng cho editor & overview) */
    thumb(i, width) {
      const sl = this.deck.slides[i];
      const sc = width / App.W;
      const inner = this.buildSlide(sl, i, { static: true });
      inner.classList.add('is-static');
      inner.style.transform = `scale(${sc})`;
      return h('div', { class: 'thumb-box', style: { width: width + 'px', height: Math.round(App.H * sc) + 'px' } }, inner);
    },
  };
  App.renderer = R;

  /* ---------------- Store: dữ liệu trình chiếu (tách khỏi renderer) ---------------- */
  App.store = {
    deck: null,
    original: null,
    load(deck) {
      deck = U.clone(deck);
      deck.slides = deck.slides || [];
      deck.slides.forEach((sl) => {
        sl.id = sl.id || U.uid('s');
        (sl.elements || []).forEach((el) => { el.id = el.id || U.uid('e'); });
      });
      deck.docId = deck.docId || U.uid('doc');
      this.deck = deck;
      return deck;
    },
    json() { return JSON.stringify(this.deck); },
  };
})();

</script>
<script data-app-module="presenter">
/* ==========================================================================
   presenter.js — Điều khiển trình chiếu: điều hướng, bước reveal, chuyển cảnh,
   HUD, phím tắt, fullscreen, overview, glow theo con trỏ & parallax.
   - Chuyển slide liên tục: chuyển cảnh cũ được kết thúc ngay → không chồng chất.
   - Glow/parallax chỉ chạy khi chuột di chuyển (tự tắt khi đứng yên).
   - Không đọc layout trong vòng lặp: toạ độ phần tử lấy từ dữ liệu deck.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h, R = App.renderer;
  const ACC = { A: '#ffb547', B: '#4fd1e8', C: '#ff8a5c', D: '#ffd36b' };

  const P = {
    index: -1, step: 0, total: 0,
    view: { s: 1, ox: 0, oy: 0 },
    leaving: null, leaveTimer: 0, enterTimer: 0,
    pointer: { sx: -9999, sy: -9999, nx: 0, ny: 0, px: 0, py: 0, lastMove: 0 },
    glowEls: [],

    init() {
      this.viewport = U.$('#viewport');
      this.stage = U.$('#stage');
      this.buildHud();
      this.layout();
      window.addEventListener('resize', U.debounce(() => this.layout(), 60));
      document.addEventListener('fullscreenchange', () => { this.layout(); this.syncHud(); });
      window.addEventListener('keydown', (e) => this.onKey(e));
      window.addEventListener('pointermove', (e) => this.onPointer(e), { passive: true });
      this.ptrTask = App.loop.add('pointer-fx', (now, dt) => this.pointerFrame(now, dt), 60);
      App.bus.on('quality', (c) => { this.cfg = c; if (!c.parallax) this.stage.style.setProperty('--px', 0), this.stage.style.setProperty('--py', 0); });
      this.cfg = App.quality.cfg();
      this.initSwipe();
      window.addEventListener('hashchange', () => {
        const n = parseInt((location.hash.match(/\d+/) || [])[0], 10);
        if (n && n - 1 !== this.index) this.go(n - 1);
      });
    },

    /* ---------------- bố cục: co giãn sân khấu 1920×1080 vào vùng hiển thị */
    layout() {
      const ed = App.editor && App.editor.active;
      const ins = ed ? App.editor.insets() : { l: 0, t: 0, r: 0, b: 0 };
      const aw = window.innerWidth - ins.l - ins.r, ah = window.innerHeight - ins.t - ins.b;
      const sc = Math.min(aw / App.W, ah / App.H) * (ed ? 0.96 : 1);
      const ox = ins.l + (aw - App.W * sc) / 2, oy = ins.t + (ah - App.H * sc) / 2;
      this.view = { s: sc, ox, oy };
      this.stage.style.transform = `translate(${ox}px, ${oy}px) scale(${sc})`;
      App.bus.emit('layout', this.view);
    },
    toStage(cx, cy) { return { x: (cx - this.view.ox) / this.view.s, y: (cy - this.view.oy) / this.view.s }; },

    /* ---------------- điều hướng */
    count() { return App.store.deck.slides.length; },
    next() {
      if (this.step < this.total) { this.step++; R.applyStep(this.index, this.step, 'step'); this.syncHud(); }
      else if (this.index < this.count() - 1) this.go(this.index + 1, { step: 0, dir: 1 });
    },
    prev() {
      if (this.step > 0) { this.step--; R.applyStep(this.index, this.step, 'instant'); this.syncHud(); }
      else if (this.index > 0) this.go(this.index - 1, { step: 'end', dir: -1 });
    },

    go(i, opts) {
      opts = opts || {};
      const n = this.count();
      if (!n) return;
      i = U.clamp(i | 0, 0, n - 1);
      const prev = this.index;
      const editing = App.editor && App.editor.active;
      const dir = opts.dir != null ? opts.dir : (i >= prev ? 1 : -1);
      this.finishLeave();
      clearTimeout(this.enterTimer);
      R.nodes.forEach((nd) => nd.classList.remove('is-entering', 't-mask', 't-circle', 't-depth', 't-fade', 't-wipe', 't-back'));

      R.prepare(i);
      const sl = App.store.deck.slides[i];
      const nodeIn = R.nodes[i];
      const nodeOut = prev >= 0 && prev !== i ? R.nodes[prev] : null;
      this.total = R.totalSteps(i);
      this.step = editing ? this.total : opts.step === 'end' ? this.total : U.clamp(opts.step || 0, 0, this.total);

      if (nodeOut) {
        R.deactivate(prev);
        nodeOut.classList.remove('is-active');
        if (!editing && !opts.instant) {
          nodeOut.classList.add('is-leaving', dir < 0 ? 'back' : 'fwd');
          this.leaving = nodeOut;
          this.leaveTimer = setTimeout(() => this.finishLeave(), 750);
        }
      }
      nodeIn.classList.add('is-active');
      const trans = editing || opts.instant ? null : dir < 0 ? 'back' : sl.transition || 'fade';
      if (trans) {
        nodeIn.classList.add('is-entering', 't-' + trans);
        this.enterTimer = setTimeout(() => nodeIn.classList.remove('is-entering', 't-' + trans), 1300);
      }
      R.applyStep(i, this.step, editing || opts.step === 'end' || opts.instant ? 'instant' : 'enter');
      R.activate(i);

      document.documentElement.dataset.section = sl.section || 'A';
      const secChanged = !nodeOut || (App.store.deck.slides[prev] || {}).section !== sl.section;
      if (App.bg) App.bg.setSection(sl.section || 'A', secChanged && !editing && prev >= 0);
      const fx = sl.fx || {};
      if (App.particles) App.particles.setMode(fx.particles || 'drift', fx.density == null ? 1 : fx.density, ACC[sl.section] || ACC.A);
      this.index = i;
      this.cacheGlow();
      this.syncHud();
      if (!editing) { try { history.replaceState(null, '', '#/' + (i + 1)); } catch (e) { /* file:// sandbox */ } }
      // Preload slide kế tiếp khi rảnh, giải phóng slide ở xa
      const idle = window.requestIdleCallback || ((f) => setTimeout(f, 200));
      idle(() => { R.prepare(i + 1); R.gc(this.index); });
      App.bus.emit('slide', { index: i });
    },

    finishLeave() {
      clearTimeout(this.leaveTimer);
      if (this.leaving) { this.leaving.classList.remove('is-leaving', 'back', 'fwd'); this.leaving = null; }
    },

    /** Dựng lại slide hiện tại sau khi sửa (giữ nguyên WebGL/particles) */
    refreshCurrent() {
      const i = this.index;
      R.replaceSlide(i);
      R.nodes[i].classList.add('is-active');
      R.prepare(i);
      this.total = R.totalSteps(i);
      this.step = Math.min(this.step, this.total);
      if (App.editor && App.editor.active) this.step = this.total;
      R.applyStep(i, this.step, 'instant');
      R.activate(i);
      this.cacheGlow();
      this.syncHud();
    },

    /* ---------------- con trỏ: glow chữ + parallax + hạt */
    cacheGlow() {
      const sl = App.store.deck.slides[this.index];
      const node = R.nodes[this.index];
      this.glowEls = [];
      if (!sl || !node) return;
      (sl.elements || []).forEach((el) => {
        if (!/\bglow\b/.test(el.cls || '')) return;
        const c = node.querySelector(`.el[data-id="${el.id}"] > .content`);
        if (c) this.glowEls.push({ c, x: el.x, y: el.y });
      });
    },
    onPointer(e) {
      const p = this.pointer;
      const st = this.toStage(e.clientX, e.clientY);
      p.sx = st.x; p.sy = st.y;
      p.nx = (e.clientX / window.innerWidth) * 2 - 1;
      p.ny = (e.clientY / window.innerHeight) * 2 - 1;
      p.cx = e.clientX; p.cy = e.clientY;
      p.lastMove = performance.now();
      if (!this.ptrTask.on) App.loop.set(this.ptrTask, true);
      this.wakeHud();
    },
    pointerFrame(now, dt) {
      const p = this.pointer, c = this.cfg || {};
      const k = Math.min(1, dt / 160);
      p.px += (p.nx - p.px) * k; p.py += (p.ny - p.py) * k;
      if (c.parallax) { this.stage.style.setProperty('--px', p.px.toFixed(4)); this.stage.style.setProperty('--py', p.py.toFixed(4)); }
      if (c.glow && !(App.editor && App.editor.active)) {
        for (const g of this.glowEls) { g.c.style.setProperty('--gx', (p.sx - g.x).toFixed(0) + 'px'); g.c.style.setProperty('--gy', (p.sy - g.y).toFixed(0) + 'px'); }
      }
      if (App.bg) App.bg.setMouse(p.px, -p.py);
      if (App.particles) App.particles.setMouse(p.cx, p.cy, p.px, p.py);
      const settled = Math.abs(p.nx - p.px) < 0.002 && Math.abs(p.ny - p.py) < 0.002;
      if (now - p.lastMove > 1200 && settled) App.loop.set(this.ptrTask, false);
    },

    /* ---------------- HUD */
    buildHud() {
      const b = (cls, title, html, fn) => h('button', { class: 'hud-btn ' + cls, title, 'aria-label': title, html, onclick: fn });
      this.prog = h('div', { class: 'hud-prog-fill' });
      this.counter = h('div', { class: 'hud-count' }, '1 / 1');
      this.stepDots = h('div', { class: 'hud-steps' });
      this.hud = h('div', { id: 'hud' },
        b('prev', 'Slide trước (←)', '&#8592;', () => this.prev()),
        h('div', { class: 'hud-prog', onclick: (e) => { const r = e.currentTarget.getBoundingClientRect(); this.go(Math.floor(((e.clientX - r.left) / r.width) * this.count())); } }, this.prog),
        this.counter, this.stepDots,
        b('next', 'Tiếp theo (→ / Space)', '&#8594;', () => this.next()),
        h('span', { class: 'hud-sep' }),
        b('ov', 'Tổng quan slide (O)', '<svg viewBox="0 0 20 20"><rect x="2" y="2" width="7" height="7" rx="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5"/></svg>', () => this.toggleOverview()),
        b('set', 'Cài đặt hiệu ứng (S)', '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3M4 4l2 2M14 14l2 2M4 16l2-2M14 6l2-2"/></svg>', () => App.settings && App.settings.toggle()),
        b('edit', 'Chế độ chỉnh sửa (E)', '<svg viewBox="0 0 20 20"><path d="M3 17l1-4 9-9 3 3-9 9-4 1z"/></svg>', () => App.editor && App.editor.toggle()),
        b('fs', 'Toàn màn hình (F)', '<svg viewBox="0 0 20 20"><path d="M2 7V2h5M13 2h5v5M18 13v5h-5M7 18H2v-5"/></svg>', () => this.fullscreen()),
        b('hide', 'Ẩn thanh điều khiển (H)', '&#215;', () => this.toggleHud()));
      document.getElementById('app').append(this.hud);
    },
    syncHud() {
      const n = this.count();
      this.counter.textContent = (this.index + 1) + ' / ' + n;
      this.prog.style.transform = `scaleX(${n ? (this.index + 1) / n : 0})`;
      this.stepDots.innerHTML = '';
      if (this.total > 0) for (let k = 1; k <= this.total; k++) this.stepDots.append(h('i', { class: k <= this.step ? 'on' : '' }));
      document.documentElement.classList.toggle('is-fs', !!document.fullscreenElement);
    },
    wakeHud() {
      document.documentElement.classList.remove('idle');
      clearTimeout(this.idleT);
      this.idleT = setTimeout(() => { if (!(App.editor && App.editor.active)) document.documentElement.classList.add('idle'); }, 2800);
    },
    toggleHud() { document.documentElement.classList.toggle('hud-off'); },
    fullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else (document.documentElement.requestFullscreen || function () {}).call(document.documentElement);
    },

    /* ---------------- Overview */
    toggleOverview(force) {
      let ov = U.$('#overview');
      const open = force != null ? force : !(ov && ov.classList.contains('open'));
      if (!ov) { ov = h('div', { id: 'overview' }); document.getElementById('app').append(ov); }
      if (!open) { ov.classList.remove('open'); return; }
      ov.innerHTML = '';
      const grid = h('div', { class: 'ov-grid' });
      App.store.deck.slides.forEach((sl, i) => {
        const card = h('button', { class: 'ov-card' + (i === this.index ? ' cur' : ''), onclick: () => { this.toggleOverview(false); this.go(i, { instant: false }); } },
          R.thumb(i, 300), h('span', { class: 'ov-n' }, String(i + 1)));
        grid.append(card);
      });
      ov.append(h('div', { class: 'ov-head' }, h('b', {}, 'Tổng quan'), h('span', {}, 'Bấm để chuyển tới slide · Esc để đóng')), grid);
      ov.classList.add('open');
      setTimeout(() => { const c = ov.querySelector('.cur'); c && c.scrollIntoView({ block: 'center' }); }, 30);
    },

    /* ---------------- bàn phím */
    onKey(e) {
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      if (App.editor && App.editor.active) { App.editor.onKey(e); return; }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const k = e.key;
      const ovOpen = U.$('#overview.open');
      if (k === 'Escape') { this.toggleOverview(false); App.settings && App.settings.close(); return; }
      if (ovOpen && k !== 'o' && k !== 'O') return;
      switch (k) {
        case 'ArrowRight': case 'PageDown': case ' ': case 'Enter': e.preventDefault(); this.next(); break;
        case 'ArrowLeft': case 'PageUp': case 'Backspace': e.preventDefault(); this.prev(); break;
        case 'Home': e.preventDefault(); this.go(0); break;
        case 'End': e.preventDefault(); this.go(this.count() - 1, { step: 'end' }); break;
        case 'f': case 'F': this.fullscreen(); break;
        case 'o': case 'O': this.toggleOverview(); break;
        case 'h': case 'H': this.toggleHud(); break;
        case 's': case 'S': App.settings && App.settings.toggle(); break;
        case 'e': case 'E': App.editor && App.editor.toggle(); break;
        default: return;
      }
      this.wakeHud();
    },

    initSwipe() {
      let x0 = null, y0 = 0;
      this.viewport.addEventListener('touchstart', (e) => { if (App.editor && App.editor.active) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      this.viewport.addEventListener('touchend', (e) => {
        if (x0 == null) return;
        const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) dx < 0 ? this.next() : this.prev();
        x0 = null;
      }, { passive: true });
    },
  };
  App.presenter = P;
})();

</script>
<script data-app-module="settings">
/* ==========================================================================
   settings.js — Bảng Settings: mức chất lượng, công tắc hiệu ứng, thống kê
   hiệu năng thực đo, sao lưu/khôi phục, phím tắt.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h, Q = App.quality;

  const S = {
    el: null,
    init() {
      this.el = h('div', { id: 'settings' });
      this.meter = h('div', { id: 'fpsmeter' });
      document.getElementById('app').append(this.el, this.meter);
      App.bus.on('fps', (st) => this.onFps(st));
      App.bus.on('quality', () => { if (this.isOpen()) this.render(); this.meter.classList.toggle('on', !!Q.toggles.fpsMeter); });
      this.meter.classList.toggle('on', !!Q.toggles.fpsMeter);
    },
    isOpen() { return this.el.classList.contains('open'); },
    toggle() { this.isOpen() ? this.close() : this.open(); },
    open() { this.render(); this.el.classList.add('open'); },
    close() { this.el && this.el.classList.remove('open'); },
    onFps(st) {
      if (Q.toggles.fpsMeter) this.meter.textContent = `FPS ${st.fps}  ·  ${st.frameMs} ms\nMức: ${Q.TIERS[Q.tier].label}${Q.mode === 'auto' ? ' (tự động)' : ''}`;
      if (this.isOpen()) { const n = this.el.querySelector('.live'); if (n) n.innerHTML = this.statsHtml(); }
    },
    statsHtml() {
      const st = Q.stats;
      return `<span>FPS hiện tại</span><b>${st.fps || '—'}</b><span>Thời gian khung</span><b>${st.frameMs || '—'} ms</b>` +
        `<span>Khung bị rớt</span><b>${st.drops}</b><span>WebGL</span><b>${st.webgl ? 'GPU' : st.webglSoftware ? 'Chỉ phần mềm → nền CSS' : 'Không (dùng CSS)'}</b>` +
        `<span>Khởi tạo nền</span><b>${st.initMs} ms</b><span>Mức đang chạy</span><b>${Q.TIERS[Q.tier].label}</b>` +
        (st.benchHigh != null ? `<span>Benchmark shader</span><b>${st.benchHigh} ms${st.benchBal != null ? ' / ' + st.benchBal + ' ms' : ''}</b>` : '');
    },
    render() {
      const el = this.el;
      el.innerHTML = '';
      const modes = [['auto', 'Tự động'], ['high', 'Cao'], ['balanced', 'Cân bằng'], ['performance', 'Hiệu năng']];
      el.append(h('h4', {}, 'Chất lượng hiệu ứng'),
        h('div', { class: 'seg' }, modes.map(([k, l]) => h('button', { class: Q.mode === k ? 'on' : '', onclick: () => { Q.setMode(k); this.render(); } }, l))),
        h('div', { class: 't-cap', style: { fontSize: '12.5px', marginTop: '8px' } },
          Q.mode === 'auto' ? 'Tự động đo FPS thực tế và hạ mức khi khung hình bị rớt kéo dài.' : 'Đang cố định mức đã chọn.',
          Q.reduced ? ' Hệ điều hành bật "giảm chuyển động" → dùng hiệu ứng nhẹ.' : ''));
      const tg = (k, label) => h('label', { class: 'row' }, h('span', {}, label),
        h('input', { type: 'checkbox', checked: Q.toggles[k] ? true : null, onchange: (e) => Q.setToggle(k, e.target.checked) }));
      el.append(h('h4', {}, 'Hiệu ứng'), tg('shader', 'Nền WebGL shader'), tg('particles', 'Hệ hạt (particles)'), tg('parallax', 'Parallax theo chuột'), tg('fpsMeter', 'Hiện đồng hồ FPS'));
      el.append(h('h4', {}, 'Hiệu năng (đo thực tế)'), h('div', { class: 'statgrid live', html: this.statsHtml() }));
      if (Q.stats.downgrades.length) el.append(h('div', { class: 't-cap', style: { fontSize: '12px', marginTop: '6px' } }, 'Đã tự hạ mức: ' + Q.stats.downgrades.map((d) => d.at + ' → ' + Q.TIERS[d.to].label).join('; ')));
      el.append(h('h4', {}, 'Sao lưu & khôi phục'),
        h('div', { class: 'btnrow' },
          h('button', { class: 'btn sm', onclick: () => App.io.exportHTML() }, 'Xuất HTML'),
          h('button', { class: 'btn sm ghost', onclick: () => App.io.exportJSON() }, 'Xuất JSON'),
          h('button', { class: 'btn sm ghost', onclick: () => App.io.importJSON() }, 'Nhập JSON')),
        h('div', { class: 'btnrow', style: { marginTop: '6px' } },
          h('button', { class: 'btn sm ghost', onclick: () => App.io.showSnapshots() }, 'Bản tự lưu…'),
          h('button', { class: 'btn sm ghost', onclick: () => App.io.resetToDefault() }, 'Khôi phục nội dung gốc')));
      const keys = [['→ / Space', 'Tiếp theo (từng bước)'], ['←', 'Quay lại'], ['Home / End', 'Slide đầu / cuối'], ['F', 'Toàn màn hình'], ['O', 'Tổng quan slide'], ['H', 'Ẩn/hiện thanh điều khiển'], ['S', 'Cài đặt'], ['E', 'Chế độ chỉnh sửa'], ['1–4', 'Chọn đáp án trong quiz']];
      el.append(h('h4', {}, 'Phím tắt'), h('div', { class: 'keys-help' }, keys.map(([k, v]) => [h('kbd', {}, k), h('span', {}, v)])));
    },
  };
  App.settings = S;
})();

</script>
<script data-app-module="io">
/* ==========================================================================
   io.js — Lịch sử (undo/redo), tự lưu, xuất/nhập.
   - Export HTML: ghép CSS + các module JS + dữ liệu deck hiện tại vào MỘT file
     độc lập (font nhúng sẵn, chạy offline, không phụ thuộc localStorage).
   - Export/Import JSON: sao lưu nội dung.
   - Autosave: localStorage (bọc try/catch), giữ vòng 6 bản chụp để khôi phục.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h;

  /* ---------------- History ---------------- */
  const Hs = (App.history = {
    stack: [], idx: -1, max: 80,
    reset(json) { this.stack = [json]; this.idx = 0; App.bus.emit('history'); },
    push(json) {
      if (this.stack[this.idx] === json) return;
      this.stack = this.stack.slice(0, this.idx + 1);
      this.stack.push(json);
      if (this.stack.length > this.max) this.stack.shift();
      this.idx = this.stack.length - 1;
      App.bus.emit('history');
    },
    canUndo() { return this.idx > 0; },
    canRedo() { return this.idx < this.stack.length - 1; },
    undo() { if (!this.canUndo()) return null; this.idx--; App.bus.emit('history'); return this.stack[this.idx]; },
    redo() { if (!this.canRedo()) return null; this.idx++; App.bus.emit('history'); return this.stack[this.idx]; },
  });

  const IO = (App.io = {
    key() { return 'ch3deck:autosave:' + App.store.deck.docId; },
    snapKey() { return 'ch3deck:snaps:' + App.store.deck.docId; },
    lastSaved: 0,

    init() { this.schedule = U.debounce(() => this.save(), 1200); },

    save() {
      const json = App.store.json(), t = Date.now();
      const ok = U.store.set(this.key(), JSON.stringify({ t, json }));
      try {
        const snaps = JSON.parse(U.store.get(this.snapKey()) || '[]');
        if (!snaps.length || t - snaps[snaps.length - 1].t > 60000) {
          snaps.push({ t, json });
          while (snaps.length > 6) snaps.shift();
          U.store.set(this.snapKey(), JSON.stringify(snaps));
        }
      } catch (e) { /* bộ nhớ đầy → bỏ qua bản chụp */ }
      this.lastSaved = ok ? t : 0;
      App.bus.emit('saved', { ok, t });
    },

    /** Gợi ý khôi phục nếu có bản tự lưu mới hơn nội dung trong file */
    checkRestore() {
      let rec = null;
      try { rec = JSON.parse(U.store.get(this.key()) || 'null'); } catch (e) { rec = null; }
      if (!rec || !rec.json || rec.json === App.store.json()) return;
      if (rec.t <= (App.store.deck.savedAt || 0)) return;
      const time = new Date(rec.t).toLocaleString('vi-VN');
      U.toast(`Có bản tự lưu lúc <b>${time}</b> khác với nội dung hiện tại.`, [{ label: 'Khôi phục', fn: () => this.applyJSON(rec.json, true) }]);
    },

    /** Thay toàn bộ deck (undo/redo/import/khôi phục) — không tạo lại WebGL */
    applyJSON(json, record) {
      let deck;
      try { deck = JSON.parse(json); } catch (e) { U.toast('Dữ liệu không hợp lệ.'); return false; }
      if (!deck || !Array.isArray(deck.slides) || !deck.slides.length) { U.toast('File không có slide nào hợp lệ.'); return false; }
      App.store.load(deck);
      App.renderer.renderAll();
      const i = Math.min(Math.max(0, App.presenter.index), App.store.deck.slides.length - 1);
      App.presenter.index = -1;
      App.presenter.go(i, { instant: true });
      if (record) { Hs.push(App.store.json()); this.schedule(); }
      App.bus.emit('deck-replaced');
      return true;
    },

    /* ---------------- Xuất HTML độc lập ---------------- */
    async sources() {
      const cssTag = document.getElementById('app-css');
      const mods = U.$$('script[data-app-module]');
      if (cssTag && mods.length) return { css: cssTag.textContent, mods: mods.map((m) => ({ name: m.dataset.appModule, code: m.textContent })) };
      // Chế độ mã nguồn (src/): đọc các file qua fetch (cần chạy qua máy chủ http)
      const links = U.$$('link[data-app-css]'), scripts = U.$$('script[data-app-js]');
      const read = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u); return r.text(); };
      let css = '';
      for (const l of links) css += (await read(l.href)) + '\n';
      css = await this.inlineFonts(css, links[0] ? links[0].href : location.href);
      const out = [];
      for (const s of scripts) out.push({ name: s.getAttribute('src').split('/').pop().replace('.js', ''), code: await read(s.src) });
      return { css, mods: out };
    },
    async inlineFonts(css, base) {
      const urls = [...css.matchAll(/url\(['"]?([^'")]+\.woff2?)['"]?\)/g)].map((m) => m[1]);
      for (const u of urls) {
        const abs = new URL(u, base).href;
        const buf = await (await fetch(abs)).arrayBuffer();
        let bin = ''; const b = new Uint8Array(buf);
        for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
        css = css.split(u).join('data:font/woff;base64,' + btoa(bin));
      }
      return css;
    },
    async buildHTML() {
      const src = await this.sources();
      const deck = U.clone(App.store.deck);
      deck.savedAt = Date.now();
      const json = JSON.stringify(deck).replace(/</g, '\\u003c').replace(/[\u2028\u2029]/g, (c) => '\\u' + c.charCodeAt(0).toString(16));
      const ST = 'script';
      const mods = src.mods.map((m) => `<${ST} data-app-module="${m.name}">\n${m.code.replace(/<\/script/gi, '<\\/script')}\n</${ST}>`).join('\n');
      return '<!DOCTYPE html>\n<html lang="vi">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
        `<title>${U.esc(deck.title || 'Trình chiếu')}</title>\n<style id="app-css">\n${src.css}\n</style>\n</head>\n<body>\n<div id="app"></div>\n` +
        `<${ST} type="application/json" id="deck-data">${json}</${ST}>\n${mods}\n</body>\n</html>\n`;
    },
    async exportHTML() {
      try {
        const html = await this.buildHTML();
        U.download('chuong-3-trinh-chieu.html', html, 'text/html;charset=utf-8');
        U.toast('Đã xuất file HTML độc lập (giữ nguyên nội dung & bố cục đã sửa).');
      } catch (e) {
        console.error(e);
        U.toast('Không xuất được HTML: hãy mở bản <b>index.html</b> đã đóng gói (dist), hoặc chạy bản mã nguồn qua máy chủ http.');
      }
    },
    exportJSON() {
      const deck = U.clone(App.store.deck);
      deck.savedAt = Date.now();
      U.download('chuong-3-backup.json', JSON.stringify(deck, null, 2), 'application/json');
      U.toast('Đã xuất bản sao lưu JSON.');
    },
    importJSON() {
      const inp = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => { if (this.applyJSON(String(r.result), true)) U.toast('Đã nhập dữ liệu từ <b>' + U.esc(f.name) + '</b>.'); };
        r.readAsText(f);
        inp.remove();
      });
      document.body.append(inp);
      inp.click();
    },
    showSnapshots() {
      let snaps = [];
      try { snaps = JSON.parse(U.store.get(this.snapKey()) || '[]'); } catch (e) { snaps = []; }
      let last = null;
      try { last = JSON.parse(U.store.get(this.key()) || 'null'); } catch (e) { last = null; }
      if (last) snaps = snaps.concat([last]);
      if (!snaps.length) { U.toast('Chưa có bản tự lưu nào.'); return; }
      const seen = new Set();
      const list = snaps.reverse().filter((s) => (seen.has(s.t) ? false : seen.add(s.t))).slice(0, 6);
      const box = h('div', { class: 'modal' }, h('div', { class: 'modal-card' },
        h('h3', {}, 'Khôi phục bản tự lưu'),
        h('div', { class: 'snaplist' }, list.map((s) => {
          let n = 0; try { n = JSON.parse(s.json).slides.length; } catch (e) { n = 0; }
          return h('div', { class: 'row' }, h('span', {}, new Date(s.t).toLocaleString('vi-VN') + ' · ' + n + ' slide'),
            h('button', { class: 'btn sm', onclick: () => { this.applyJSON(s.json, true); box.remove(); U.toast('Đã khôi phục.'); } }, 'Khôi phục'));
        })),
        h('div', { class: 'btnrow', style: { justifyContent: 'flex-end', marginTop: '12px' } }, h('button', { class: 'btn ghost sm', onclick: () => box.remove() }, 'Đóng'))));
      document.getElementById('app').append(box);
    },
    resetToDefault() {
      U.toast('Thay toàn bộ nội dung bằng bản gốc? (Có thể hoàn tác bằng Ctrl+Z)', [{
        label: 'Khôi phục gốc',
        fn: () => { const d = U.clone(App.defaultDeck); d.docId = App.store.deck.docId; this.applyJSON(JSON.stringify(d), true); },
      }]);
    },
  });
})();

</script>
<script data-app-module="editor">
/* ==========================================================================
   editor.js — Editor Mode (chỉnh sửa trực tiếp, hoạt động thật).
   - Chọn / kéo thả / resize (8 tay nắm, Shift giữ tỉ lệ) + đường gióng (snap).
   - Nhấp đúp để sửa chữ, sửa ô bảng. Định dạng: cỡ chữ, màu, căn lề, B/I/U.
   - Thay ảnh, sửa dữ liệu biểu đồ/widget (tự tính lại), sửa quiz.
   - Lớp (z-order), bước xuất hiện, hiệu ứng vào, parallax.
   - Quản lý slide: thêm, nhân bản, xoá, sắp xếp (kéo thả thumbnail).
   - Undo/Redo, autosave. Chỉ dựng lại slide hiện tại — không đụng tới WebGL.
   ========================================================================== */
(function () {
  'use strict';
  const App = window.App, U = App.util, h = U.h;
  const P = () => App.presenter, R = App.renderer;
  const SECTIONS = [['A', 'Mở đầu'], ['B', 'Bài 8'], ['C', 'Bài 9'], ['D', 'Củng cố']];
  const TRANS = [['fade', 'Mờ dần'], ['mask', 'Mặt nạ trượt'], ['circle', 'Vòng tròn mở'], ['wipe', 'Quét chéo'], ['depth', 'Chiều sâu']];
  const ANIMS = [['up', 'Trồi lên'], ['mask', 'Mặt nạ'], ['left', 'Từ trái'], ['right', 'Từ phải'], ['scale', 'Phóng to'], ['fade', 'Mờ dần'], ['none', 'Không']];
  const HANDLES = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];

  const E = {
    active: false, sel: null, built: false, editingNode: null, clip: null,

    insets() { return { l: 236, t: 56, r: 344, b: 10 }; },
    get deck() { return App.store.deck; },
    slide() { return this.deck.slides[P().index]; },
    elOf(id) { return (this.slide().elements || []).find((e) => e.id === id); },
    nodeOf(id) { return R.nodes[P().index] && R.nodes[P().index].querySelector(`.el[data-id="${id}"]`); },

    toggle() { this.active ? this.close() : this.open(); },
    open() {
      if (!this.built) this.build();
      this.active = true;
      document.documentElement.classList.add('editing');
      document.documentElement.classList.remove('idle');
      App.settings && App.settings.close();
      P().toggleOverview(false);
      this.ui.classList.add('open');
      P().layout();
      P().go(P().index, { instant: true });
      this.renderThumbs();
      this.select(null);
      U.toast('Chế độ chỉnh sửa: nhấp để chọn · kéo để di chuyển · nhấp đúp để sửa chữ.');
    },
    close() {
      this.finishText();
      this.select(null);
      this.active = false;
      document.documentElement.classList.remove('editing');
      this.ui.classList.remove('open');
      P().layout();
      P().go(P().index, { instant: true, step: 0 });
      App.io.save();
    },

    /* ================================================================ UI */
    build() {
      this.built = true;
      const tb = (label, title, fn, cls) => h('button', { class: 'ed-b ' + (cls || ''), title: title || label, onclick: fn }, label);
      this.undoB = tb('↶', 'Hoàn tác (Ctrl+Z)', () => this.undo());
      this.redoB = tb('↷', 'Làm lại (Ctrl+Y)', () => this.redo());
      this.saveInfo = h('span', { class: 'ed-save' }, '');
      const addSel = h('select', { class: 'ed-sel', title: 'Thêm phần tử', onchange: (e) => { this.addElement(e.target.value); e.target.value = ''; } },
        h('option', { value: '' }, '＋ Thêm phần tử…'),
        h('option', { value: 'text' }, 'Văn bản'), h('option', { value: 'title' }, 'Tiêu đề'), h('option', { value: 'card' }, 'Thẻ nội dung'),
        h('option', { value: 'image' }, 'Ảnh…'), h('option', { value: 'shape' }, 'Hình khối'), h('option', { value: 'table' }, 'Bảng số liệu'),
        h('option', { value: 'w:histogram' }, 'Biểu đồ tần số'), h('option', { value: 'w:meancalc' }, 'Tính số trung bình'),
        h('option', { value: 'w:mediancalc' }, 'Tính trung vị'), h('option', { value: 'w:cumlocate' }, 'Nhóm chứa trung vị'), h('option', { value: 'w:quiz' }, 'Quiz'));
      this.top = h('div', { class: 'ed-top' },
        h('b', { class: 'ed-logo' }, 'Editor'),
        tb('✕ Thoát', 'Thoát chế độ chỉnh sửa (E)', () => this.close(), 'ghost'),
        h('span', { class: 'ed-sep' }), this.undoB, this.redoB, h('span', { class: 'ed-sep' }), addSel,
        h('span', { class: 'ed-sep' }),
        tb('＋ Slide', 'Thêm slide mới sau slide hiện tại', () => this.addSlide()),
        tb('⧉ Nhân bản', 'Nhân bản slide', () => this.dupSlide()),
        tb('🗑 Xoá slide', 'Xoá slide hiện tại', () => this.delSlide(), 'warn'),
        h('span', { class: 'ed-grow' }), this.saveInfo,
        tb('Xuất HTML', 'Xuất file HTML độc lập', () => App.io.exportHTML(), 'pri'),
        tb('Xuất JSON', 'Sao lưu JSON', () => App.io.exportJSON()),
        tb('Nhập JSON', 'Nhập từ JSON', () => App.io.importJSON()));
      this.thumbs = h('div', { class: 'ed-thumbs' });
      this.props = h('div', { class: 'ed-props' });
      this.ui = h('div', { id: 'editor-ui' }, this.top, this.thumbs, this.props);
      document.getElementById('app').append(this.ui);

      // Lớp chọn nằm trong toạ độ sân khấu → tự co giãn theo scale
      this.selBox = h('div', { class: 'ed-selbox' }, HANDLES.map((d) => h('i', { class: 'ed-h h-' + d, 'data-h': d })));
      this.guides = h('div', { class: 'ed-guides' });
      P().stage.append(this.guides, this.selBox);

      P().stage.addEventListener('pointerdown', (e) => this.onDown(e));
      P().stage.addEventListener('dblclick', (e) => this.onDbl(e));
      App.bus.on('layout', (v) => P().stage.style.setProperty('--inv', (1 / v.s).toFixed(3)));
      App.bus.on('history', () => this.syncHist());
      App.bus.on('saved', (s) => { this.saveInfo.textContent = s.ok ? 'Đã tự lưu ' + new Date(s.t).toLocaleTimeString('vi-VN') : 'Không lưu được (trình duyệt chặn)'; });
      App.bus.on('slide', () => { if (this.active) { this.select(null); this.markThumb(); } });
      App.bus.on('deck-replaced', () => { this.reattach(); if (this.active) { this.renderThumbs(); this.select(null); } });
      P().stage.style.setProperty('--inv', (1 / P().view.s).toFixed(3));
      this.syncHist();
    },
    syncHist() { if (!this.undoB) return; this.undoB.disabled = !App.history.canUndo(); this.redoB.disabled = !App.history.canRedo(); },

    /* ================================================================ commit / history */
    commit(opts) {
      opts = opts || {};
      App.history.push(App.store.json());
      App.io.schedule();
      if (opts.rerender !== false) { P().refreshCurrent(); this.reattach(); }
      if (opts.thumbs) this.renderThumbs(); else this.updateThumb(P().index);
      if (opts.props !== false) this.renderProps();
    },
    undo() { this.finishText(); const j = App.history.undo(); if (j) this.restore(j); },
    redo() { this.finishText(); const j = App.history.redo(); if (j) this.restore(j); },
    restore(json) {
      const keep = this.sel;
      App.io.applyJSON(json, false);
      App.io.schedule();
      this.reattach();
      this.renderThumbs();
      this.select(this.elOf(keep) ? keep : null);
    },
    reattach() { P().stage.append(this.guides, this.selBox); if (this.sel && !this.elOf(this.sel)) this.sel = null; this.drawSel(); },

    /* ================================================================ selection */
    select(id) {
      this.sel = id;
      this.drawSel();
      this.renderProps();
    },
    drawSel() {
      const el = this.sel && this.elOf(this.sel);
      if (!el) { this.selBox.style.display = 'none'; return; }
      Object.assign(this.selBox.style, { display: 'block', left: el.x + 'px', top: el.y + 'px', width: el.w + 'px', height: el.h + 'px' });
    },

    onDown(e) {
      if (!this.active || e.button !== 0) return;
      const hd = e.target.closest('.ed-h');

    },

    startDrag(e, mode, dir) {

      const vx = [0, App.W / 2, App.W].concat(...others.map((x) => [x.x, x.x + x.w / 2, x.x + x.w]));
      const vy = [0, App.H / 2, App.H].concat(...others.map((x) => [x.y, x.y + x.h / 2, x.y + x.h]));
      const snap = (val, cands) => { let best = null, bd = 9; for (const c of cands) { const d = Math.abs(c - val); if (d < bd) { bd = d; best = c; } } return best; };
      const move = (ev) => {
        const dx = (ev.clientX - sx) / s, dy = (ev.clientY - sy) / s;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;

            for (const [off, arr] of [[0, gx], [o.w / 2, gx], [o.w, gx]]) { const t = snap(nx + off, vx); if (t != null) { nx = Math.round(t - off); arr.push(t); break; } }
            for (const [off, arr] of [[0, gy], [o.h / 2, gy], [o.h, gy]]) { const t = snap(ny + off, vy); if (t != null) { ny = Math.round(t - off); arr.push(t); break; } }

          let { x, y, w, h: hh } = o;
          if (dir.includes('e')) w = o.w + dx;
          if (dir.includes('s')) hh = o.h + dy;
          if (dir.includes('w')) { w = o.w - dx; x = o.x + dx; }
          if (dir.includes('n')) { hh = o.h - dy; y = o.y + dy; }
          if (ev.shiftKey && dir.length === 2) { const r = o.w / o.h; if (w / hh > r) w = hh * r; else hh = w / r; if (dir.includes('w')) x = o.x + o.w - w; if (dir.includes('n')) y = o.y + o.h - hh; }

        this.commit({ rerender: mode === 'resize' && el.type === 'widget' });

      window.addEventListener('pointerup', up);
    },

    /* ================================================================ sửa chữ / bảng trực tiếp */
    onDbl(e) {

      if (k === 'PageUp') { e.preventDefault(); P().go(P().index - 1, { instant: true }); return; }

        if (!el) { if (k === 'ArrowRight' || k === 'ArrowDown') P().go(P().index + 1, { instant: true }); else P().go(P().index - 1, { instant: true }); return; }

    /* ================================================================ phần tử */

    addElement(kind) {

    dupElement() {

    zorder(op) {

    pickImage(cb) {

        r.onload = () => {

        };

          field('Màu nền', h('input', { type: 'color', value: /^#/.test(st.background || '') ? st.background : '#4fd1e8', onchange: (e) => set(() => (st.background = e.target.value)) })),
          field('Bo góc (px)', h('input', { type: 'number', value: parseInt(st.borderRadius, 10) || 18, onchange: (e) => set(() => (st.borderRadius = e.target.value + 'px')) })));
      }
      if (el.type === 'table') this.tableProps(p, el, set);
      if (el.type === 'widget') this.widgetProps(p, el, set);

      p.append(sec('Trình chiếu'), h('div', { class: 'g2' },
        field('Bước xuất hiện', h('input', { type: 'number', min: 0, max: 20, value: el.step || 0, onchange: (e) => set(() => (el.step = Math.max(0, +e.target.value || 0))) })),
        field('Hiệu ứng vào', sel(ANIMS, el.anim || 'up', (v) => set(() => (el.anim = v))))));
      p.append(field('Parallax (độ sâu ' + (el.depth || 0) + ')', h('input', { type: 'range', min: 0, max: 1, step: 0.05, value: el.depth || 0, onchange: (e) => set(() => (el.depth = +e.target.value || undefined)) })));

        bt('Nhân bản (Ctrl+D)', () => this.dupElement()), bt('Xoá (Delete)', () => this.delElement(), 'warn')));
    },

    slideProps(p) {
      const sl = this.slide();

      const set = (fn) => { fn(); App.history.push(App.store.json()); App.io.schedule(); P().refreshCurrent(); this.reattach(); this.updateThumb(P().index); App.bg && App.bg.setSection(sl.section, false); const fx = sl.fx || {}; App.particles && App.particles.setMode(fx.particles || 'drift', fx.density == null ? 1 : fx.density); };
      sl.fx = sl.fx || {};
      p.append(h('div', { class: 'ed-ph' }, h('b', {}, 'Slide ' + (P().index + 1)), h('span', { class: 'ed-id' }, (sl.elements || []).length + ' phần tử')));
      p.append(h('div', { class: 'ed-hint' }, 'Nhấp vào một phần tử trên slide để chỉnh sửa nó.'));
      p.append(sec('Thiết lập slide'),
        field('Phần (màu chủ đạo)', sel(SECTIONS, sl.section || 'A', (v) => set(() => (sl.section = v)))),
        field('Chuyển cảnh', sel(TRANS, sl.transition || 'fade', (v) => set(() => (sl.transition = v)))),
        field('Hệ hạt', sel([['network', 'Mạng lưới'], ['drift', 'Trôi nhẹ'], ['off', 'Tắt']], sl.fx.particles || 'drift', (v) => set(() => (sl.fx.particles = v)))),
        field('Mật độ hạt', h('input', { type: 'range', min: 0, max: 1, step: 0.05, value: sl.fx.density == null ? 1 : sl.fx.density, onchange: (e) => set(() => (sl.fx.density = +e.target.value)) })),
        field('Lớp tối nền (veil)', h('input', { type: 'range', min: 0, max: 1, step: 0.05, value: sl.veil || 0, onchange: (e) => set(() => (sl.veil = +e.target.value || undefined)) })),
        h('div', { class: 'btnrow' },
          bt('Ảnh nền…', () => this.pickImage((src) => set(() => (sl.bgImage = src)))),
          sl.bgImage ? bt('Bỏ ảnh nền', () => set(() => delete sl.bgImage)) : null));
      const ta = h('textarea', { rows: 4 }, sl.notes || '');
      ta.addEventListener('change', () => { sl.notes = ta.value; App.history.push(App.store.json()); App.io.schedule(); });
      p.append(sec('Ghi chú cho người trình bày'), ta);
    },

    tableProps(p, el, set) {
      const rows = el.table.rows;
      p.append(sec('Bảng'), h('div', { class: 'ed-hint' }, 'Nhấp đúp vào bảng để sửa trực tiếp từng ô.'),
        h('div', { class: 'btnrow' },
          bt('+ Hàng', () => set(() => rows.push(rows[0].map(() => '')))),
          bt('− Hàng', () => set(() => rows.length > 1 && rows.pop())),
          bt('+ Cột', () => set(() => rows.forEach((r) => r.push('')))),
          bt('− Cột', () => set(() => rows[0].length > 1 && rows.forEach((r) => r.pop())))),
        h('label', { class: 'row' }, h('span', {}, 'Hàng đầu là tiêu đề'), h('input', { type: 'checkbox', checked: el.table.head ? true : null, onchange: (e) => set(() => (el.table.head = e.target.checked)) })),
        h('label', { class: 'row' }, h('span', {}, 'Cột đầu là tiêu đề'), h('input', { type: 'checkbox', checked: el.table.headCol !== false ? true : null, onchange: (e) => set(() => (el.table.headCol = e.target.checked)) })),
        h('label', { class: 'row' }, h('span', {}, 'Chữ gọn (compact)'), h('input', { type: 'checkbox', checked: el.compact ? true : null, onchange: (e) => set(() => (el.compact = e.target.checked)) })),
        h('label', { class: 'row' }, h('span', {}, 'Rất gọn (tight)'), h('input', { type: 'checkbox', checked: el.tight ? true : null, onchange: (e) => set(() => (el.tight = e.target.checked)) })));
    },

    widgetProps(p, el, set) {
      const def = App.widgets.reg[el.widget] || {};
      const d = (el.data = el.data || {});
      p.append(sec('Dữ liệu'));
      if (def.editor === 'groups') {
        const grid = h('div', { class: 'ggrid' }, h('span', {}, 'a (trái)'), h('span', {}, 'b (phải)'), h('span', {}, 'Tần số'), h('span', {}));
        const rowsState = (d.groups || []).map((g) => ({ a: g.a, b: g.b, m: g.m }));
        const draw = () => {
          grid.querySelectorAll('.gr').forEach((n) => n.remove());
          rowsState.forEach((g, i) => {
            ['a', 'b', 'm'].forEach((k) => grid.append(h('input', { class: 'gr', type: 'number', step: 'any', value: g[k], oninput: (e) => (g[k] = e.target.value) })));
            grid.append(h('button', { class: 'gr ed-x', title: 'Xoá nhóm', onclick: () => { rowsState.splice(i, 1); draw(); } }, '×'));
          });
        };
        draw();
        p.append(grid, h('div', { class: 'btnrow' },
          bt('+ Nhóm', () => { const l = rowsState[rowsState.length - 1] || { a: 0, b: 10, m: 1 }; rowsState.push({ a: +l.b, b: +l.b + (+l.b - +l.a || 10), m: 1 }); draw(); }),
          bt('Áp dụng dữ liệu', () => set(() => { d.groups = rowsState.map((g) => ({ a: +g.a, b: +g.b, m: +g.m || 0 })); }), 'pri')));

        if (el.widget === 'meancalc' || el.widget === 'mediancalc') p.append(h('div', { class: 'g2' }, txt('Đơn vị', 'unit'), field('Số chữ số thập phân', h('input', { type: 'number', min: 0, max: 4, value: d.decimals == null ? 2 : d.decimals, onchange: (e) => set(() => (d.decimals = +e.target.value)) }))));
